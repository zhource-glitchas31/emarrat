<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پنل انبوه ساز</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#F4F5F7; --surface:#FFFFFF; --surface-alt:#FAFBFC; --border:#E7E9EC; --border-soft:#EFF1F3;
    --text:#181B20; --text-muted:#6B7280; --text-faint:#9AA1AC;
    --primary:#1F5C4C; --primary-dark:#153F34; --primary-light:#E6F0EC;
    --gold:#AD7C2B; --gold-light:#F8EFDD;
    --danger:#B3392C; --danger-light:#FBEAE7;
    --warning:#B07A1E; --warning-light:#FAF0DC;
    --info:#2B5A82; --info-light:#E8F0F7;
    --radius:16px; --radius-sm:10px;
    --shadow-sm:0 1px 2px rgba(20,23,28,.05);
    --shadow-md:0 10px 30px -14px rgba(20,23,28,.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  /* Safety net: any inline icon svg without an explicit sized wrapper falls back to a sane size
     instead of the browser's default (which can render huge, unsized icons). More specific
     rules elsewhere (.btn svg, .nav-item svg, etc.) still win over this. */
  svg{width:18px;height:18px;flex-shrink:0;}
  body{font-family:'Vazirmatn',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.7;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:#D7DBE0;border-radius:8px;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;}
  input,textarea,select{font-family:inherit;font-size:13.5px;}

  .app{display:flex;min-height:100vh;}

  /* SIDEBAR */
  .sidebar{width:250px;flex:0 0 250px;background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;}
  .brand{padding:22px 20px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border-soft);}
  .brand-mark{width:36px;height:36px;border-radius:10px;background:linear-gradient(155deg,var(--primary),var(--primary-dark));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:15px;flex-shrink:0;}
  .brand-name{font-weight:700;font-size:14.5px;color:var(--text);}
  .brand-sub{font-size:11.5px;color:var(--text-faint);margin-top:1px;}

  .nav{padding:14px 12px;display:flex;flex-direction:column;gap:2px;flex:1;overflow-y:auto;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--text-muted);font-size:13.5px;font-weight:500;cursor:pointer;}
  .nav-item svg{width:18px;height:18px;flex-shrink:0;}
  .nav-item:hover{background:var(--surface-alt);color:var(--text);}
  .nav-item.active{background:var(--primary-light);color:var(--primary-dark);font-weight:700;}
  .nav-badge{margin-right:auto;background:var(--danger);color:#fff;font-size:10.5px;font-weight:700;border-radius:20px;min-width:18px;height:18px;display:flex;align-items:center;justify-content:center;padding:0 5px;}
  .nav-badge.muted{background:var(--gold);}

  .sidebar-foot{padding:14px;border-top:1px solid var(--border-soft);display:flex;align-items:center;gap:10px;}
  .avatar{width:34px;height:34px;border-radius:50%;background:var(--gold-light);color:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12.5px;flex-shrink:0;}
  .sidebar-foot .name{font-size:12.5px;font-weight:700;}
  .sidebar-foot .role{font-size:11px;color:var(--text-faint);}

  /* MAIN */
  .main{flex:1;min-width:0;display:flex;flex-direction:column;}
  .topbar{height:64px;flex:0 0 64px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 26px;position:sticky;top:0;z-index:20;gap:14px;}
  .page-title{font-size:16px;font-weight:700;}
  .page-sub{font-size:12px;color:var(--text-faint);margin-top:1px;}
  .topbar-right{display:flex;align-items:center;gap:12px;}
  .icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--text-muted);position:relative;cursor:pointer;}
  .icon-btn:hover{background:var(--surface-alt);}
  .icon-btn svg{width:17px;height:17px;}
  .dot-flag{position:absolute;top:-4px;left:-4px;min-width:18px;height:18px;padding:0 5px;border-radius:20px;background:var(--danger);color:#fff;font-size:10.5px;font-weight:700;border:1.5px solid var(--surface);display:flex;align-items:center;justify-content:center;}

  .content{padding:20px 26px 60px;flex:1;}

  /* BREADCRUMB */
  .breadcrumb{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:14px;font-size:12.5px;color:var(--text-faint);}
  .breadcrumb .bc-item{cursor:pointer;transition:color .12s;}
  .breadcrumb .bc-item:hover{color:var(--primary-dark);}
  .breadcrumb .bc-item.current{color:var(--text);font-weight:700;cursor:default;}

  /* GENERIC */
  .btn{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:10px;font-size:13px;font-weight:600;border:1px solid transparent;white-space:nowrap;transition:all .12s;}
  .btn svg{width:15px;height:15px;}
  .btn-primary{background:var(--primary);color:#fff;}
  .btn-primary:hover{background:var(--primary-dark);}
  .btn-ghost{background:var(--surface);color:var(--text);border-color:var(--border);}
  .btn-ghost:hover{background:var(--surface-alt);}
  .btn-soft{background:var(--primary-light);color:var(--primary-dark);}
  .btn-danger-soft{background:var(--danger-light);color:var(--danger);}
  .btn-danger-soft:hover{background:#F5D5D0;}
  .btn-sm{padding:6px 11px;font-size:12px;border-radius:8px;}

  .badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:20px;line-height:1.4;}
  .badge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;}
  .badge-active{background:var(--primary-light);color:var(--primary-dark);}
  .badge-pending{background:var(--warning-light);color:var(--warning);}
  .badge-rejected{background:var(--danger-light);color:var(--danger);}
  .badge-revision{background:var(--gold-light);color:var(--gold);}
  .badge-draft{background:#EEF0F2;color:var(--text-muted);}
  .badge-done{background:var(--info-light);color:var(--info);}
  .badge-clickable{cursor:pointer;transition:transform .1s;}
  .badge-clickable:hover{transform:scale(1.04);}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);}
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:22px;overflow-x:auto;}
  .tab{padding:11px 16px;font-size:13.5px;font-weight:600;color:var(--text-faint);border-bottom:2px solid transparent;white-space:nowrap;cursor:pointer;}
  .tab:hover{color:var(--text);}
  .tab.active{color:var(--primary-dark);border-color:var(--primary);}
  .tab .count{background:var(--surface-alt);color:var(--text-faint);font-size:11px;padding:1px 7px;border-radius:20px;margin-right:6px;}
  .tab.active .count{background:var(--primary-light);color:var(--primary-dark);}

  /* PROJECT CARDS */
  .projects-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px;}
  .p-card{overflow:hidden;transition:box-shadow .15s,transform .15s;display:flex;flex-direction:column;cursor:pointer;}
  .p-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);}
  .p-head{display:flex;gap:14px;padding:16px 16px 14px;align-items:flex-start;}
  .p-thumb{width:104px;height:104px;border-radius:12px;flex-shrink:0;position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:8px;}
  .p-thumb .thumb-icon{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:rgba(255,255,255,.28);}
  .p-thumb .thumb-icon svg{width:40px;height:40px;}
  .p-thumb .type-chip{position:relative;z-index:1;background:rgba(255,255,255,.94);color:var(--text);font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;}
  .p-head-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;}
  .p-status-pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;padding:3px 10px;border-radius:20px;align-self:flex-start;line-height:1.5;}
  .p-status-pill::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;}
  .p-status-pill.is-active{background:var(--primary-light);color:var(--primary-dark);}
  .p-status-pill.is-pending{background:var(--warning-light);color:var(--warning);}
  .p-status-pill.is-revision{background:var(--gold-light);color:var(--gold);}
  .p-status-pill.is-rejected{background:var(--danger-light);color:var(--danger);}
  .p-status-pill.is-done{background:var(--info-light);color:var(--info);}
  .p-status-pill.is-draft{background:#EEF0F2;color:var(--text-muted);}
  .p-title{font-size:15px;font-weight:800;color:var(--text);line-height:1.5;}
  .p-city{font-size:11.5px;color:var(--text-faint);display:flex;align-items:center;gap:5px;}
  .p-city svg{width:12px;height:12px;flex-shrink:0;}
  .p-stage-line{font-size:11.5px;color:var(--text-muted);display:flex;align-items:center;gap:6px;background:var(--surface-alt);border:1px solid var(--border-soft);padding:6px 10px;border-radius:9px;}
  .p-stage-line svg{width:13px;height:13px;color:var(--primary);flex-shrink:0;}
  .p-stage-line b{color:var(--text);font-weight:700;}
  .p-budget-grid{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface-alt);border-top:1px solid var(--border-soft);border-bottom:1px solid var(--border-soft);}
  .p-budget-col{padding:12px 6px;text-align:center;position:relative;}
  .p-budget-col + .p-budget-col::before{content:'';position:absolute;right:0;top:14px;bottom:14px;width:1px;background:var(--border);}
  .p-budget-label{font-size:10.5px;color:var(--text-faint);display:block;margin-bottom:5px;white-space:nowrap;}
  .p-budget-val{font-size:13px;font-weight:800;color:var(--text);white-space:nowrap;}
  .p-budget-val small{font-size:9.5px;font-weight:600;color:var(--text-faint);margin-right:2px;}
  .p-budget-val.highlight{color:var(--primary-dark);}
  .p-duration{padding:14px 16px 10px;}
  .p-duration-row{display:flex;align-items:center;justify-content:space-between;font-size:11.5px;color:var(--text-muted);margin-bottom:8px;gap:8px;}
  .p-duration-row b{color:var(--text);font-weight:700;}
  .p-duration-row .p-pct{color:var(--primary-dark);font-weight:800;}
  .p-duration .progress-track{margin:0;height:8px;}
  .p-duration .progress-fill{background:linear-gradient(90deg,var(--primary),#3A8067);}
  .p-foot{display:flex;gap:6px;padding:0 16px 16px;margin-top:auto;}
  .p-foot .btn{justify-content:center;padding:8px 10px;font-size:12px;}
  .p-foot .p-btn-view{flex:0 0 30%;}
  .p-foot .p-btn-edit{flex:0 0 70%;}
  .p-btn-dark{background:var(--primary-dark);color:#fff;border-color:var(--primary-dark);}
  .p-btn-dark:hover{background:#0D2A22;}
  .p-btn-gold{background:var(--gold);color:#fff;border-color:var(--gold);}
  .p-btn-gold:hover{background:#8F6520;}

  .progress-track{height:6px;background:var(--border-soft);border-radius:20px;overflow:hidden;margin:10px 0 12px;}
  .progress-fill{height:100%;border-radius:20px;background:var(--primary);}

  .section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:12px;flex-wrap:wrap;}
  .section-title{font-size:15.5px;font-weight:700;}
  .section-desc{font-size:12px;color:var(--text-faint);margin-top:2px;}

  table.dt{width:100%;border-collapse:collapse;font-size:13px;}
  table.dt th{text-align:right;font-size:11.5px;color:var(--text-faint);font-weight:600;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--surface-alt);}
  table.dt td{padding:13px 14px;border-bottom:1px solid var(--border-soft);vertical-align:middle;}
  table.dt tr:last-child td{border-bottom:none;}
  table.dt tr:hover td{background:var(--surface-alt);}

  /* DOC CARDS */
  .doc-card{border:1px solid var(--border);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;}
  .doc-card.rev{border-color:#EEDDB6;background:#FEFBF3;}
  .doc-card.missing{border-style:dashed;background:var(--surface-alt);}
  .doc-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
  .doc-icon{width:34px;height:34px;border-radius:9px;background:var(--info-light);color:var(--info);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .doc-icon svg{width:16px;height:16px;}
  .doc-name{font-weight:700;font-size:13px;}
  .doc-meta{font-size:11.5px;color:var(--text-faint);}
  .doc-actions{display:flex;gap:6px;margin-top:6px;}

  /* IDENTITY CARDS */
  .identity-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  @media (max-width:820px){.identity-grid{grid-template-columns:1fr;}}
  .id-card{padding:18px;position:relative;overflow:hidden;}
  .id-card-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .id-card-icon{width:38px;height:38px;border-radius:10px;background:var(--primary-light);color:var(--primary-dark);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .id-card-icon svg{width:19px;height:19px;}
  .id-card-titles{min-width:0;}
  .id-card-title{font-weight:800;font-size:13.5px;}
  .id-card-sub{font-size:11.5px;color:var(--text-faint);margin-top:1px;}
  .id-card-head .badge{margin-right:auto;flex-shrink:0;}
  .id-card-body{display:grid;gap:12px;}
  .id-card-locked .id-card-inner{filter:blur(5px);opacity:.55;pointer-events:none;user-select:none;}
  .id-card-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;background:linear-gradient(180deg, rgba(255,255,255,.25), rgba(255,255,255,.82));}
  .add-fab{width:46px;height:46px;border-radius:50%;background:var(--primary);color:#fff;border:none;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-md);transition:background .12s,transform .12s;}
  .add-fab svg{width:20px;height:20px;}
  .add-fab:hover{background:var(--primary-dark);transform:scale(1.05);}
  .id-card-overlay-title{font-size:13px;font-weight:800;color:var(--text);}
  .id-card-overlay-text{font-size:11.5px;color:var(--text-muted);max-width:230px;line-height:1.9;}

  /* LEGAL TEASER (company info tab) */
  .legal-teaser{position:relative;border-radius:var(--radius-sm);overflow:hidden;}
  .legal-teaser .legal-teaser-inner{filter:blur(5px);opacity:.5;pointer-events:none;user-select:none;}
  .legal-teaser-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:28px 20px;background:linear-gradient(180deg, rgba(255,255,255,.2), rgba(255,255,255,.85));}
  .legal-teaser-overlay .id-card-icon{width:52px;height:52px;}
  .legal-teaser-overlay .id-card-icon svg{width:24px;height:24px;}
  .legal-teaser-title{font-size:14.5px;font-weight:800;color:var(--text);}
  .legal-teaser-text{font-size:12.5px;color:var(--text-muted);max-width:340px;line-height:1.9;}

  .timeline{position:relative;padding-right:26px;}
  .timeline::before{content:'';position:absolute;right:9px;top:4px;bottom:4px;width:2px;background:var(--border);}
  .t-item{position:relative;padding-bottom:22px;}
  .t-item:last-child{padding-bottom:0;}
  .t-dot{position:absolute;right:-26px;top:2px;width:20px;height:20px;border-radius:50%;background:var(--primary-light);border:2px solid var(--surface);display:flex;align-items:center;justify-content:center;color:var(--primary-dark);}
  .t-dot svg{width:10px;height:10px;}
  .t-dot.pending{background:var(--warning-light);color:var(--warning);}
  .t-title{font-size:13px;font-weight:700;}
  .t-desc{font-size:12px;color:var(--text-faint);margin-top:2px;}
  .t-time{font-size:11px;color:var(--text-faint);margin-top:4px;}

  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .field{display:flex;flex-direction:column;gap:6px;}
  .field.full{grid-column:1/-1;}
  .field label{font-size:12.5px;font-weight:600;color:var(--text-muted);}
  .field input,.field select,.field textarea{border:1px solid var(--border);border-radius:9px;padding:10px 12px;background:var(--surface);color:var(--text);outline:none;transition:border-color .12s;}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);}
  .field input:disabled,.field input[readonly]{background:var(--surface-alt);color:var(--text-muted);cursor:not-allowed;}
  .field .hint{font-size:11px;color:var(--text-faint);}
  .upload-box{border:1.5px dashed var(--border);border-radius:12px;padding:22px;text-align:center;color:var(--text-faint);font-size:12.5px;background:var(--surface-alt);cursor:pointer;}
  .upload-box svg{width:22px;height:22px;margin-bottom:8px;color:var(--text-faint);}

  /* MODAL */
  .overlay{position:fixed;inset:0;background:rgba(15,17,21,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
  .modal{background:var(--surface);border-radius:18px;width:100%;max-width:760px;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 30px 60px -20px rgba(0,0,0,.35);}
  .modal.narrow{max-width:520px;}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--border);flex-shrink:0;}
  .modal-title{font-size:15px;font-weight:700;}
  .modal-close{width:30px;height:30px;border-radius:9px;border:1px solid var(--border);background:var(--surface-alt);display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .modal-close svg{width:14px;height:14px;}
  .modal-body{padding:22px;overflow-y:auto;}
  .modal-foot{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;border-top:1px solid var(--border);flex-shrink:0;gap:10px;}

  .stepper{display:flex;align-items:center;padding:0 22px;padding-top:16px;}
  .step{display:flex;align-items:center;gap:8px;flex:1;}
  .step-circle{width:26px;height:26px;border-radius:50%;background:var(--surface-alt);border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;color:var(--text-faint);flex-shrink:0;}
  .step.done .step-circle{background:var(--primary);border-color:var(--primary);color:#fff;}
  .step.current .step-circle{background:var(--primary-dark);border-color:var(--primary-dark);color:#fff;}
  .step-label{font-size:12px;font-weight:600;color:var(--text-faint);white-space:nowrap;}
  .step.done .step-label,.step.current .step-label{color:var(--text);}
  .step-line{flex:1;height:1.5px;background:var(--border);margin:0 6px;}

  .empty{text-align:center;padding:50px 20px;color:var(--text-faint);}
  .empty svg{width:34px;height:34px;margin-bottom:10px;color:var(--border);}
  .empty .t{font-size:13.5px;font-weight:700;color:var(--text-muted);margin-bottom:3px;}

  .notif-item{display:flex;gap:12px;padding:16px 18px;border-bottom:1px solid var(--border-soft);cursor:pointer;}
  .notif-item:last-child{border-bottom:none;}
  .notif-item.unread{background:var(--surface-alt);}
  .notif-item:hover{background:#F1F3F5;}
  .notif-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .notif-icon svg{width:16px;height:16px;}
  .notif-title{font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px;}
  .notif-title .unread-dot{width:7px;height:7px;border-radius:50%;background:var(--danger);}
  .notif-desc{font-size:12px;color:var(--text-faint);margin-top:2px;}
  .notif-time{font-size:11px;color:var(--text-faint);white-space:nowrap;}

  .acct-tabs{display:flex;flex-direction:column;gap:2px;width:190px;flex-shrink:0;}
  .acct-tab{padding:11px 14px;border-radius:10px;font-size:13px;font-weight:600;color:var(--text-muted);cursor:pointer;}
  .acct-tab:hover{background:var(--surface-alt);}
  .acct-tab.active{background:var(--primary-light);color:var(--primary-dark);}
  .acct-layout{display:flex;gap:24px;align-items:flex-start;}
  .kv-row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border-soft);font-size:13px;gap:12px;}
  .kv-row .k{color:var(--text-faint);}

function fmt(n){ return Number(n).toLocaleString('en-US'); }
function toFa(n){ return String(n).replace(/\d/g, d=>'۰۱۲۳۴۵۶۷۸۹'[d]); }
function badge(status, clickable){
  const m = STATUS_META[status] || STATUS_META.draft;
  return `<span class="badge ${m.cls} ${clickable?'badge-clickable':''}">${m.label}</span>`;
}
function docBadge(status, projectId, idx){
  const map = {
    approved:{l:'تایید شده', c:'badge-active'},
    pending:{l:'در انتظار بررسی', c:'badge-pending'},
    revision:{l:'نیازمند اصلاح', c:'badge-revision'},
    rejected:{l:'رد شده', c:'badge-rejected'},
  }[status] || {l:'—', c:'badge-draft'};
  const clickable = (status==='revision' || status==='rejected') && projectId!=null;
  return `<span class="badge ${map.c} ${clickable?'badge-clickable':''}"
    ${clickable?`data-action="show-expert" data-id="${projectId}" data-kind="doc" data-idx="${idx}"`:''}>${map.l}</span>`;
}
function findProject(id){ return PROJECTS.find(p=>p.id===id); }
function parseDuration(str){
  if(!str || str==='—') return 0;
  const fa = '۰۱۲۳۴۵۶۷۸۹';
  const en = String(str).replace(/[۰-۹]/g, d => fa.indexOf(d));
  const m = en.match(/(\d+)/);
  return m ? parseInt(m[1], 10) : 0;
}

function showToast(msg, type='success'){
  const el = document.createElement('div');
  el.className = 'toast toast-'+type;
  const icon = type==='error' ? I.warn : type==='info' ? I.info : I.check;
  el.innerHTML = icon + '<span>'+msg+'</span>';
  document.body.appendChild(el);
  requestAnimationFrame(()=> el.classList.add('show'));
  setTimeout(()=>{
    el.classList.remove('show');
    setTimeout(()=> el.remove(), 280);
  }, 2800);
}

}

/* ============== PAGINATION ============== */
function pager(key, total){
  const per = state.PER_PAGE[key];
  const pages = Math.max(1, Math.ceil(total/per));
  const cur = Math.min(state.page[key], pages);
  if(pages<=1) return '';
  const nums = [];
  for(let i=1;i<=pages;i++) nums.push(i);
  return `<div class="pager">
    <button data-action="page-goto" data-key="${key}" data-page="${cur-1}" ${cur<=1?'disabled':''}>${I.chevRight}</button>
    ${nums.map(n=>`<button class="${n===cur?'active':''}" data-action="page-goto" data-key="${key}" data-page="${n}">${n}</button>`).join('')}
    <button data-action="page-goto" data-key="${key}" data-page="${cur+1}" ${cur>=pages?'disabled':''}>${I.chevLeft}</button>
    <span class="pager-info">${total} مورد</span>
  </div>`;
}
function paginate(arr, key){
  const per = state.PER_PAGE[key];
  const cur = Math.min(state.page[key], Math.max(1, Math.ceil(arr.length/per)));
  const start = (cur-1)*per;
  return arr.slice(start, start+per);
}

/* ---------- INVESTMENT / PROGRESS LINE CHART (Chart.js) ---------- */
function buildProgressSeries(p){
  const labels = [];
  const progressData = [];
  const ratios = []; // cumulative weight fraction (0-100) at each point, used to scale raised capital
  const pointMeta = [];
  let cumulative = 0;
  (p.stages||[]).forEach(s=>{
    if(s.status==='done' && s.end && s.end!=='—'){
      cumulative += (s.weight||0);
      labels.push(s.end);
      progressData.push(cumulative);
      ratios.push(cumulative);
      pointMeta.push({title:s.t, state:'انجام شد'});
    } else if(s.status==='active' && s.start && s.start!=='—'){
      labels.push(s.start);
      progressData.push(cumulative);
      ratios.push(cumulative);
      pointMeta.push({title:s.t, state:'در حال انجام'});
    }
  });
  const lastRatio = ratios.length ? ratios[ratios.length-1] : 0;
  const scale = lastRatio > 0 ? (p.raised||0) / lastRatio : 0;
  const raisedData = ratios.map(r => Math.round(r*scale));
  return {labels, progressData, raisedData, pointMeta, hasData: labels.length > 0};
}

function chartWrapHtml(p){
  const series = buildProgressSeries(p);
  if(!series.hasData){
    return `<div class="empty" style="padding:26px;">${I.info}<div class="t">داده‌ای برای نمایش نمودار وجود ندارد</div><div>پس از ثبت اولین گزارش پیشرفت این پروژه، روند پیشرفت و جذب سرمایه در این بخش به صورت نمودار نمایش داده می‌شود.</div></div>`;
  }
  return `<div class="chart-wrap" style="height:300px;"><canvas class="invest-chart-canvas" data-project-id="${p.id}" id="chart-${p.id}"></canvas></div>`;
}

/* ---------- HISTORY ---------- */
function buildHistoryLog(p){
  const log = [];
  log.push({time:p.created, actor:'انبوه‌ساز', field:'ثبت اولیه پروژه', before:'—', after:'در انتظار بررسی', afterTone:'pending'});
  p.stages.forEach(s=>{
    if(s.status==='draft') return;
    log.push({
      time: s.end!=='—'?s.end:s.start,
      actor:'کارشناس ارزیابی',
      field:'وضعیت مرحله «'+s.t+'»',
      before:'در انتظار اجرا',
      after: s.status==='done'?'تکمیل شده':'در حال اجرا',
      afterTone: s.status==='done'?'done':'active'
    });
  });
  (p.docs||[]).forEach(d=>{
    const tone = d.status==='approved'?'active':d.status==='rejected'?'rejected':d.status==='revision'?'revision':'pending';
    const label = d.status==='approved'?'تایید شده':d.status==='rejected'?'رد شده':d.status==='revision'?'نیازمند اصلاح':'در انتظار بررسی';
    log.push({
      time:d.date,
      actor: d.status==='approved'?'کارشناس ارزیابی':'انبوه‌ساز',
      field:'مدرک «'+d.name+'»',
      before:'ارسال شده',
      after: label,
      afterTone: tone
    });
  });
  return log.sort((a,b)=> (a.time<b.time?1:-1));
}
function pHistory(p){
  if(!state.historyLoaded[p.id]){
    setTimeout(()=>{ state.historyLoaded[p.id]=true; render(); }, 600);
    return `<div class="card" style="padding:40px;text-align:center;color:var(--text-faint);font-size:12.5px;">${I.history}<div style="margin-top:8px;">در حال دریافت تاریخچه تغییرات از پایگاه‌داده...</div></div>`;
  }
  const log = buildHistoryLog(p);
  const toneCls = {pending:'badge-pending', active:'badge-active', done:'badge-done', rejected:'badge-rejected', revision:'badge-revision'};
  return `
    <div class="section-head">
      <div class="section-desc">این لاگ به‌صورت خودکار از رکوردهای ثبت‌شده پروژه در پایگاه‌داده خوانده می‌شود.</div>
      <button class="btn btn-ghost btn-sm" data-action="refresh-history" data-id="${p.id}">${I.history}به‌روزرسانی</button>
    </div>
    <div class="card" style="padding:0;overflow:hidden;">
      <table class="dt">
        <thead><tr><th>تاریخ</th><th>ثبت‌کننده</th><th>مورد تغییر</th><th>مقدار قبلی</th><th>مقدار جدید</th></tr></thead>
        <tbody>
          ${log.map(i=>`<tr>

const WIZARD_STEPS = ['اطلاعات عمومی','اطلاعات فنی','مدارک و مستندات','اطلاعات مالی'];
function renderWizard(){
  const step = state.wizard.step;
  return `
  <div class="overlay" data-action="close-wizard-bg">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-head">
        <div class="modal-title">ثبت پروژه جدید</div>
        <div class="modal-close" data-action="close-wizard">${I.x}</div>
      </div>
      <div class="stepper">
        ${WIZARD_STEPS.map((l,i)=>`
          ${i>0?`<div class="step-line"></div>`:''}
          <div class="step ${i+1<step?'done':i+1===step?'current':''}" style="flex:0 0 auto;">
            <div class="step-circle">${i+1<step?I.check:i+1}</div>
            <div class="step-label">${l}</div>
          </div>
        `).join('')}
      </div>
      <div class="modal-body">${wizardStepBody(step)}</div>
      <div class="modal-foot">
        <button class="btn btn-ghost" data-action="wizard-prev" ${step===1?'style="visibility:hidden"':''}>${I.chevLeft}مرحله قبل</button>

          ? `<button class="btn btn-primary" data-action="wizard-next">مرحله بعد</button>`
          : `<button class="btn btn-primary" data-action="wizard-submit">${I.check}ثبت نهایی پروژه</button>`}

    </div>

}

const REPORT_TABS = [
  {k:'submitted', l:'در انتظار بررسی'},
  {k:'approved',  l:'تایید شده'},
  {k:'revision',  l:'نیازمند اصلاح'},
  {k:'rejected',  l:'رد شده'},
  {k:'history',   l:'تاریخچه'},
];

function reportAllItems(filterPid){
  const all = [];
  PROJECTS.forEach(p=>{
    if(filterPid && filterPid!=='all' && p.id!==filterPid) return;
    (p.docs||[]).forEach((d,idx)=>{
      all.push({
        pid:p.id, idx, projName:p.name, stage:d.cat, kind:'مدرک',
        text:d.name,
        status: d.status==='approved'?'approved':d.status==='rejected'?'rejected':d.status==='revision'?'revision':'submitted',
        date:d.date, expertComment:d.expertComment
      });
    });
    (p.stages||[]).forEach((s,idx)=>{
      if(s.report){
        all.push({
          pid:p.id, idx, projName:p.name, stage:s.t, kind:'گزارش پیشرفت',
          text:s.report,
          status: s.status==='done' ? 'approved' : 'submitted',
          date: s.end!=='—'?s.end:s.start
        });
      }
    });
  });
  return all;
}

function renderReports(){
  const pid = state.reportsProjectFilter || 'all';
  return `

      <div class="section-desc">گزارش‌های پیشرفت و مدارک ارسالی، پیگیری و تاریخچه تغییرات.</div>

function renderReportItems(pid, showProject){
  const allItems = reportAllItems(pid);
  const isHistory = state.reportTab === 'history';

  const tabsHtml = `<div class="tabs">
    ${REPORT_TABS.map(t=>`<div class="tab ${state.reportTab===t.k?'active':''}" data-action="reptab" data-tab="${t.k}">${t.l}${t.k!=='history'?`<span class="count">${allItems.filter(i=>i.status===t.k).length}</span>`:''}</div>`).join('')}

  if(isHistory) return tabsHtml + renderReportsHistory(pid);

  const filtered = allItems.filter(i=>i.status===state.reportTab);
  if(!filtered.length) return tabsHtml + emptyState('موردی یافت نشد','در این بخش موردی برای نمایش وجود ندارد.');

  const isRevision = i => i.status==='revision' || i.status==='rejected';

  return tabsHtml + filtered.map(i=>`

        ${isRevision(i) && i.kind==='مدرک' ? `<button class="btn btn-ghost btn-sm" data-action="show-expert" data-id="${i.pid}" data-kind="doc" data-idx="${i.idx}" title="مشاهده نظر کارشناس">${I.chat}نظر کارشناس</button>` : ''}

    </div>`).join('');

function renderReportsHistory(pid){
  const key = 'reports-hist-'+pid;
  if(!state.historyLoaded[key]){
    setTimeout(()=>{ state.historyLoaded[key]=true; render(); }, 600);
    return `<div class="card" style="padding:40px;text-align:center;color:var(--text-faint);font-size:12.5px;">${I.history}<div style="margin-top:8px;">در حال دریافت تاریخچه از پایگاه‌داده...</div></div>`;
  }
  const projs = pid==='all' ? PROJECTS : [findProject(pid)].filter(Boolean);
  const log = [];
  projs.forEach(p => buildHistoryLog(p).forEach(it => log.push({...it, projName:p.name})));
  log.sort((a,b)=> (a.time<b.time?1:-1));
  const toneCls = {pending:'badge-pending', active:'badge-active', done:'badge-done', rejected:'badge-rejected', revision:'badge-revision'};
  return `
    <div class="section-head" style="margin-bottom:12px;">
      <div class="section-desc">این لاگ به‌صورت خودکار از رکوردهای ثبت‌شده پروژه در پایگاه‌داده خوانده می‌شود.</div>
      <button class="btn btn-ghost btn-sm" data-action="refresh-history" data-id="${key}">${I.history}به‌روزرسانی</button>
    </div>
    <div class="card" style="padding:0;overflow:hidden;">
      <table class="dt">
        <thead><tr><th>تاریخ</th>${pid==='all'?'<th>پروژه</th>':''}<th>ثبت‌کننده</th><th>مورد تغییر</th><th>قبلی</th><th>جدید</th></tr></thead>
        <tbody>
          ${log.map(i=>`<tr>
            <td style="white-space:nowrap;">${i.time}</td>
            ${pid==='all'?`<td>${i.projName}</td>`:''}
            <td>${i.actor}</td>
            <td style="font-weight:700;">${i.field}</td>
            <td style="color:var(--text-faint);">${i.before}</td>
            <td><span class="badge ${toneCls[i.afterTone]||'badge-draft'}">${i.after}</span></td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>`;
}

            <div class="doc-top"><div class="doc-icon">${I.file}</div><span class="badge badge-active">تایید شده</span></div>
            <div class="doc-name">پشت کارت ملی</div>
            <div class="doc-meta">ارسال: ۱۴۰۲/۰۵/۱۰</div>
          </div>
        </div>
      </div>
      <div class="card id-card ${state.legalActive?'':'id-card-locked'}">
        <div class="id-card-inner">
          <div class="id-card-head">
            <div class="id-card-icon">${I.building}</div>
            <div class="id-card-titles">
              <div class="id-card-title">احراز هویت حقوقی</div>
              <div class="id-card-sub">مدارک ثبتی شرکت</div>
            </div>
            ${state.legalActive?`<span class="badge badge-active">تایید شده</span>`:''}
          </div>
          <div class="id-card-body">
            <div class="doc-card">
              <div class="doc-top"><div class="doc-icon">${I.file}</div><span class="badge badge-active">تایید شده</span></div>
              <div class="doc-name">روزنامه رسمی شرکت</div>
              <div class="doc-meta">ارسال: ۱۴۰۲/۰۵/۱۰</div>
            </div>
            <div class="doc-card">
              <div class="doc-top"><div class="doc-icon">${I.file}</div><span class="badge badge-active">تایید شده</span></div>
              <div class="doc-name">آگهی صاحبان امضا</div>
              <div class="doc-meta">ارسال: ۱۴۰۲/۰۵/۱۰</div>
            </div>
          </div>
        </div>
        ${state.legalActive?'':`
        <div class="id-card-overlay">
          <button class="add-fab" data-action="activate-legal">${I.plus}</button>
          <div class="id-card-overlay-title">فعالیت به عنوان شخص حقوقی</div>
          <div class="id-card-overlay-text">برای احراز هویت حقوقی، مدارک ثبتی شرکت را اضافه کنید.</div>
        </div>`}
      </div>
    </div>`;
  if(state.acctTab==='security') return `
    <div class="section-title" style="margin-bottom:14px;">امنیت حساب</div>
    <div class="kv-row"><span class="k">رمز عبور</span><span class="v"><button class="btn btn-ghost btn-sm">تغییر رمز</button></span></div>
    <div class="kv-row"><span class="k">آخرین ورود</span><span class="v"> · ۱۴۰۳/۰۶/۱۴ ساعت ۰۹:۱۲</span></div>`;
}

/* ============== EVENT BINDING ============== */
function bindEvents(){
  document.querySelectorAll('[data-onchange]').forEach(el=>{
    el.addEventListener('change', (e)=>{
      const action = el.dataset.onchange;
      if(action==='wizard-status-change'){ state.wizard.statusValue = el.value; render(); }
      else if(action==='reports-project-filter'){ state.reportsProjectFilter = el.value; state.page.reports=1; render(); }
      else if(action==='fin-project-change'){ state.finNew.projectId = el.value; render(); }
    });
  });

  document.querySelectorAll('[data-action]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      e.stopPropagation();
      const a = el.dataset.action;

      if(a==='nav'){ state.view = el.dataset.view; state.selectedProject=null; state.projectTab='overview'; state.reportTab='submitted'; }
      else if(a==='filter'){ state.statusFilter = el.dataset.status; state.page.projects=1; }
      else if(a==='open-project'){ state.selectedProject = el.dataset.id; state.projectTab='overview'; state.reportTab='submitted'; }
      else if(a==='back-projects'){ state.selectedProject=null; }
      else if(a==='ptab'){ state.projectTab = el.dataset.tab; if(el.dataset.tab==='progress') state.reportTab='submitted'; }

      else if(a==='open-wizard'){ state.wizard = {open:true, step:1, statusValue:'شروع نشده'}; }
      else if(a==='close-wizard' || a==='close-wizard-bg'){ state.wizard.open=false; }
      else if(a==='wizard-next'){ state.wizard.step = Math.min(4, state.wizard.step+1); }
      else if(a==='wizard-prev'){ state.wizard.step = Math.max(1, state.wizard.step-1); }
      else if(a==='wizard-submit'){ state.wizard.open=false; showToast('پروژه با موفقیت ثبت شد و برای بررسی ارسال گردید.'); }

      else if(a==='page-goto'){
        const key = el.dataset.key;
        const page = +el.dataset.page;
        state.page[key] = Math.max(1, page);
      }

      // submit request - go to financial new with pre-filled project
      else if(a==='submit-request'){
        state.selectedProject = null;
        state.view = 'financial';
        state.finTab = 'new';
        state.finNew.projectId = el.dataset.id;
      }

      // project edit modal (description + gallery)
      else if(a==='edit-project'){ state.projectEdit = {open:true, id:el.dataset.id}; }
      else if(a==='close-proj-edit' || a==='close-proj-edit-bg'){ state.projectEdit = {open:false, id:null}; }
      else if(a==='save-proj-edit'){
        const p = findProject(el.dataset.id);
        const modalEl = el.closest('.modal');
        const desc = modalEl.querySelector('[data-field="project-desc"]')?.value;
        if(p && desc != null) p.desc = desc;
        state.projectEdit = {open:false, id:null};
        showToast('اطلاعات و تصاویر پروژه ذخیره شد.');
        render();
        return;
      }
      else if(a==='add-gallery-img'){
        const p = findProject(el.dataset.id);
        p.gallery = p.gallery || [];
        const grads = ['linear-gradient(135deg,#1F5C4C,#3A8067)','linear-gradient(135deg,#AD7C2B,#D3A854)','linear-gradient(135deg,#2B5A82,#4C7EA8)','linear-gradient(135deg,#153F34,#2B6B58)'];
        p.gallery.push({gradient: grads[p.gallery.length % grads.length], isCover: p.gallery.length===0});
        showToast('تصویر جدید به گالری اضافه شد.');
      }
      else if(a==='delete-gallery-img'){
        const p = findProject(el.dataset.id);
        const idx = +el.dataset.idx;
        const g = p.gallery[idx];
        if(g && g.isCover && p.gallery.length>1){
          showToast('ابتدا کاور جدیدی انتخاب کنید سپس این تصویر را حذف نمایید.','error');
          return;
        }
        showConfirm({
          title:'حذف تصویر گالری',
          msg:'آیا از حذف این تصویر از گالری پروژه مطمئن هستید؟',
          onConfirm:()=>{
            p.gallery.splice(idx,1);
            state.confirm=null;
            showToast('تصویر از گالری حذف شد.');
            render();
          }
        });
        return;
      }
      else if(a==='set-cover'){
        const p = findProject(el.dataset.id);
        const idx = +el.dataset.idx;
        p.gallery.forEach((g,i)=> g.isCover = (i===idx));
        p.cover = p.gallery[idx].gradient;
        showToast('تصویر کاور پروژه به‌روزرسانی شد.');
      }

      else if(a==='delete-card'){
        const id = el.dataset.id;
        showConfirm({
          title:'حذف کارت بانکی',
          msg:'آیا از حذف این کارت بانکی مطمئن هستید؟',
          onConfirm:()=>{
            state.cards = state.cards.filter(c=>c.id!==id);
            state.confirm=null;
            showToast('کارت بانکی حذف شد.');
            render();
          }
        });
        return;
      }

      else if(a==='send-for-review'){
        const p = findProject(el.dataset.id);
        showConfirm({
          title:'ارسال برای بررسی',
          msg:`پروژه «${p.name}» برای بررسی به کارشناس ارسال می‌شود.`,
          confirmLabel:'ارسال',
          onConfirm:()=>{
            p.status = 'pending';
            state.confirm=null;
            showToast('پروژه برای بررسی ارسال شد.');
            render();
          }
        });
        return;
      }

      else if(a==='confirm-yes'){ if(state.confirm && state.confirm.onConfirm) state.confirm.onConfirm(); return; }
      else if(a==='confirm-cancel'){ closeConfirm(); return; }

      else if(a==='show-expert'){ state.expertModal = {projectId: el.dataset.id, kind: el.dataset.kind, idx:+el.dataset.idx}; }
      else if(a==='close-expert' || a==='close-expert-bg'){ state.expertModal = {projectId:null, kind:null, idx:null}; }

      else if(a==='notif-click'){ state.notifModal = {id: el.dataset.id}; }
      else if(a==='close-notif' || a==='close-notif-bg'){ state.notifModal = {id:null}; }
      else if(a==='notif-mark-read'){
        state.notifRead.add(el.dataset.id);
        showToast('اعلان به عنوان خوانده‌شده علامت‌گذاری شد.');
      }
      else if(a==='mark-all-read'){
        NOTIFS.forEach(n=> state.notifRead.add(n.id));
        showToast('همه اعلان‌ها خوانده‌شده شدند.');
      }
      else if(a==='notiftab'){ state.notifTab = el.dataset.tab; }

      else if(a==='fintab'){ state.finTab = el.dataset.tab; state.page.financial=1; }
      else if(a==='fin-new-submit'){
        state.finTab='pending';
        showToast('درخواست مالی با موفقیت ثبت شد.');
      }

      else if(a==='reptab'){ state.reportTab = el.dataset.tab; state.page.reports=1; }

      else if(a==='acctab'){ state.acctTab = el.dataset.tab; }

      else if(a==='activate-legal'){
        state.legalActive = true;
        showToast('اطلاعات حقوقی فعال شد. اکنون می‌توانید مدارک شرکت را تکمیل کنید.');
      }

      else if(a==='open-modal'){
        state.modal = {
          type: el.dataset.modal,
          id: el.dataset.id||null,
          cat: el.dataset.cat||null,
          replace: el.dataset.replace!=null ? +el.dataset.replace : null,
          context: el.dataset.context || 'panel',
        };
        if(state.expertModal.projectId){ state.expertModal = {projectId:null, kind:null, idx:null}; }
      }
      else if(a==='close-modal' || a==='close-modal-bg'){ state.modal = {type:null, id:null, cat:null, replace:null, context:'panel'}; }
      else if(a==='modal-submit'){
        const modalEl = el.closest('.modal');
        const mt = el.dataset.modaltype;
        const pid = el.dataset.id;
        const getField = n => modalEl.querySelector(`[data-field="${n}"]`);
        if(mt==='uploadDoc'){
          const proj = findProject(pid);
          const cat = getField('doc-cat')?.value || state.modal.cat || 'سایر مدارک';
          const name = getField('doc-name')?.value || 'مدرک جدید';
          if(state.modal.replace != null && proj.docs[state.modal.replace]){
            proj.docs[state.modal.replace].status = 'pending';
            proj.docs[state.modal.replace].date = '۱۴۰۳/۰۶/۱۴';
            showToast('مدرک اصلاح‌شده مجدداً ارسال و برای بررسی ارسال شد.');
          } else {
            proj.docs.push({cat, name, date:'۱۴۰۳/۰۶/۱۴', status:'pending'});
            showToast('مدرک با موفقیت آپلود شد.');
          }
        }
        else if(mt==='addCard'){
          const bank = getField('bank')?.value || 'سایر';
          const holder = getField('holder')?.value || ACCOUNT.personal.name;
          const number = getField('number')?.value || '••••-••••-••••-••••';
          const iban = getField('iban')?.value || '—';
          state.cards.push({id:'c'+Date.now(), bank, holder, number, iban});
          showToast('کارت بانکی جدید افزوده شد.');
        }
        else if(mt==='newReport'){
          showToast('گزارش با موفقیت ثبت و برای بررسی ارسال شد.');
        }
        else if(mt==='editPersonal'){
          ACCOUNT.personal.name = getField('name')?.value || ACCOUNT.personal.name;
          ACCOUNT.personal.phone = getField('phone')?.value || ACCOUNT.personal.phone;
          ACCOUNT.personal.email = getField('email')?.value || ACCOUNT.personal.email;
          showToast('اطلاعات شخصی ذخیره شد.');
        }
        else if(mt==='editCompany'){
          ACCOUNT.company.name = getField('name')?.value || ACCOUNT.company.name;
          ACCOUNT.company.nid = getField('nid')?.value || ACCOUNT.company.nid;
          ACCOUNT.company.reg = getField('reg')?.value || ACCOUNT.company.reg;
          ACCOUNT.company.eco = getField('eco')?.value || ACCOUNT.company.eco;
          ACCOUNT.company.address = getField('address')?.value || ACCOUNT.company.address;
          showToast('اطلاعات شرکت ذخیره شد.');
        }
        state.modal = {type:null, id:null, cat:null, replace:null, context:'panel'};
      }

      else if(a==='refresh-history'){ state.historyLoaded[el.dataset.id] = false; }

      render();
    });
  });
}

render();
</script>
