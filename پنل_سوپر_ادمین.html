<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پنل سوپر ادمین | عمارت</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js" integrity="sha384-iU8HYtnGQ8Cy4zl7gbNMOhsDTTKX02BTXptVP/vqAWIaTfM7isw76iyZCsjL2eVi" crossorigin="anonymous"></script>
<style>
  :root{
    --bg:#F4F5F7; --surface:#FFFFFF; --surface-alt:#FAFBFC; --border:#E7E9EC; --border-soft:#EFF1F3;
    --text:#181B20; --text-muted:#6B7280; --text-faint:#9AA1AC;
    --primary:#1F5C4C; --primary-dark:#153F34; --primary-light:#E6F0EC;
    --gold:#AD7C2B; --gold-light:#F8EFDD;
    --danger:#B3392C; --danger-light:#FBEAE7;
    --warning:#B07A1E; --warning-light:#FAF0DC;
    --info:#2B5A82; --info-light:#E8F0F7;
    --radius:16px; --radius-sm:10px;
    --shadow-sm:0 1px 2px rgba(20,23,28,.05);
    --shadow-md:0 10px 30px -14px rgba(20,23,28,.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  /* Safety net: any inline icon svg without an explicit sized wrapper falls back to a sane size
     instead of the browser's default (which can render huge, unsized icons). More specific
     rules elsewhere (.btn svg, .nav-item svg, etc.) still win over this. */
  svg{width:18px;height:18px;flex-shrink:0;}
  body{font-family:'Vazirmatn',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.7;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:#D7DBE0;border-radius:8px;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;}
  input,textarea,select{font-family:inherit;font-size:13.5px;}

  .app{display:flex;min-height:100vh;}

  /* SIDEBAR */
  .sidebar{width:250px;flex:0 0 250px;background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;}
  .brand{padding:22px 20px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border-soft);}
  .brand-mark{width:36px;height:36px;border-radius:10px;background:linear-gradient(155deg,var(--primary),var(--primary-dark));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:15px;flex-shrink:0;}
  .brand-name{font-weight:700;font-size:14.5px;color:var(--text);}
  .brand-sub{font-size:11.5px;color:var(--text-faint);margin-top:1px;}

  .nav{padding:14px 12px;display:flex;flex-direction:column;gap:2px;flex:1;overflow-y:auto;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--text-muted);font-size:13.5px;font-weight:500;cursor:pointer;}
  .nav-item svg{width:18px;height:18px;flex-shrink:0;}
  .nav-item:hover{background:var(--surface-alt);color:var(--text);}
  .nav-item.active{background:var(--primary-light);color:var(--primary-dark);font-weight:700;}
  .nav-badge{margin-right:auto;background:var(--danger);color:#fff;font-size:10.5px;font-weight:700;border-radius:20px;min-width:18px;height:18px;display:flex;align-items:center;justify-content:center;padding:0 5px;}
  .nav-badge.muted{background:var(--gold);}

  .sidebar-foot{padding:14px;border-top:1px solid var(--border-soft);display:flex;align-items:center;gap:10px;}
  .avatar{width:34px;height:34px;border-radius:50%;background:var(--gold-light);color:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12.5px;flex-shrink:0;}
  .sidebar-foot .name{font-size:12.5px;font-weight:700;}
  .sidebar-foot .role{font-size:11px;color:var(--text-faint);}

  /* MAIN */
  .main{flex:1;min-width:0;display:flex;flex-direction:column;}
  .topbar{height:64px;flex:0 0 64px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 26px;position:sticky;top:0;z-index:20;gap:14px;}
  .page-title{font-size:16px;font-weight:700;}
  .page-sub{font-size:12px;color:var(--text-faint);margin-top:1px;}
  .topbar-right{display:flex;align-items:center;gap:12px;}
  .icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--text-muted);position:relative;cursor:pointer;}
  .icon-btn:hover{background:var(--surface-alt);}
  .icon-btn svg{width:17px;height:17px;}
  .dot-flag{position:absolute;top:-4px;left:-4px;min-width:18px;height:18px;padding:0 5px;border-radius:20px;background:var(--danger);color:#fff;font-size:10.5px;font-weight:700;border:1.5px solid var(--surface);display:flex;align-items:center;justify-content:center;}

  .content{padding:20px 26px 60px;flex:1;}

  /* BREADCRUMB */
  .breadcrumb{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:14px;font-size:12.5px;color:var(--text-faint);}
  .breadcrumb .bc-item{cursor:pointer;transition:color .12s;}
  .breadcrumb .bc-item:hover{color:var(--primary-dark);}
  .breadcrumb .bc-item.current{color:var(--text);font-weight:700;cursor:default;}

  /* GENERIC */
  .btn{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:10px;font-size:13px;font-weight:600;border:1px solid transparent;white-space:nowrap;transition:all .12s;}
  .btn svg{width:15px;height:15px;}
  .btn-primary{background:var(--primary);color:#fff;}
  .btn-primary:hover{background:var(--primary-dark);}
  .btn-ghost{background:var(--surface);color:var(--text);border-color:var(--border);}
  .btn-ghost:hover{background:var(--surface-alt);}
  .btn-soft{background:var(--primary-light);color:var(--primary-dark);}
  .btn-danger-soft{background:var(--danger-light);color:var(--danger);}
  .btn-danger-soft:hover{background:#F5D5D0;}
  .btn-sm{padding:6px 11px;font-size:12px;border-radius:8px;}

  .badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:20px;line-height:1.4;}
  .badge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;}
  .badge-active{background:var(--primary-light);color:var(--primary-dark);}
  .badge-pending{background:var(--warning-light);color:var(--warning);}
  .badge-rejected{background:var(--danger-light);color:var(--danger);}
  .badge-revision{background:var(--gold-light);color:var(--gold);}
  .badge-draft{background:#EEF0F2;color:var(--text-muted);}
  .badge-done{background:var(--info-light);color:var(--info);}
  .badge-clickable{cursor:pointer;transition:transform .1s;}
  .badge-clickable:hover{transform:scale(1.04);}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);}
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:22px;overflow-x:auto;}
  .tab{padding:11px 16px;font-size:13.5px;font-weight:600;color:var(--text-faint);border-bottom:2px solid transparent;white-space:nowrap;cursor:pointer;}
  .tab:hover{color:var(--text);}
  .tab.active{color:var(--primary-dark);border-color:var(--primary);}
  .tab .count{background:var(--surface-alt);color:var(--text-faint);font-size:11px;padding:1px 7px;border-radius:20px;margin-right:6px;}
  .tab.active .count{background:var(--primary-light);color:var(--primary-dark);}

  /* PROJECT CARDS */
  .projects-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px;}
  .p-card{overflow:hidden;transition:box-shadow .15s,transform .15s;display:flex;flex-direction:column;cursor:pointer;}
  .p-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);}
  .p-head{display:flex;gap:14px;padding:16px 16px 14px;align-items:flex-start;}
  .p-thumb{width:104px;height:104px;border-radius:12px;flex-shrink:0;position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:8px;}
  .p-thumb .thumb-icon{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:rgba(255,255,255,.28);}
  .p-thumb .thumb-icon svg{width:40px;height:40px;}
  .p-thumb .type-chip{position:relative;z-index:1;background:rgba(255,255,255,.94);color:var(--text);font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;}
  .p-head-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;}
  .p-status-pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;padding:3px 10px;border-radius:20px;align-self:flex-start;line-height:1.5;}
  .p-status-pill::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;}
  .p-status-pill.is-active{background:var(--primary-light);color:var(--primary-dark);}
  .p-status-pill.is-pending{background:var(--warning-light);color:var(--warning);}
  .p-status-pill.is-revision{background:var(--gold-light);color:var(--gold);}
  .p-status-pill.is-rejected{background:var(--danger-light);color:var(--danger);}
  .p-status-pill.is-done{background:var(--info-light);color:var(--info);}
  .p-status-pill.is-draft{background:#EEF0F2;color:var(--text-muted);}
  .p-title{font-size:15px;font-weight:800;color:var(--text);line-height:1.5;}
  .p-city{font-size:11.5px;color:var(--text-faint);display:flex;align-items:center;gap:5px;}
  .p-city svg{width:12px;height:12px;flex-shrink:0;}
  .p-stage-line{font-size:11.5px;color:var(--text-muted);display:flex;align-items:center;gap:6px;background:var(--surface-alt);border:1px solid var(--border-soft);padding:6px 10px;border-radius:9px;}
  .p-stage-line svg{width:13px;height:13px;color:var(--primary);flex-shrink:0;}
  .p-stage-line b{color:var(--text);font-weight:700;}
  .p-budget-grid{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface-alt);border-top:1px solid var(--border-soft);border-bottom:1px solid var(--border-soft);}
  .p-budget-col{padding:12px 6px;text-align:center;position:relative;}
  .p-budget-col + .p-budget-col::before{content:'';position:absolute;right:0;top:14px;bottom:14px;width:1px;background:var(--border);}
  .p-budget-label{font-size:10.5px;color:var(--text-faint);display:block;margin-bottom:5px;white-space:nowrap;}
  .p-budget-val{font-size:13px;font-weight:800;color:var(--text);white-space:nowrap;}
  .p-budget-val small{font-size:9.5px;font-weight:600;color:var(--text-faint);margin-right:2px;}
  .p-budget-val.highlight{color:var(--primary-dark);}
  .p-duration{padding:14px 16px 10px;}
  .p-duration-row{display:flex;align-items:center;justify-content:space-between;font-size:11.5px;color:var(--text-muted);margin-bottom:8px;gap:8px;}
  .p-duration-row b{color:var(--text);font-weight:700;}
  .p-duration-row .p-pct{color:var(--primary-dark);font-weight:800;}
  .p-duration .progress-track{margin:0;height:8px;}
  .p-duration .progress-fill{background:linear-gradient(90deg,var(--primary),#3A8067);}
  .p-foot{display:flex;gap:6px;padding:0 16px 16px;margin-top:auto;}
  .p-foot .btn{justify-content:center;padding:8px 10px;font-size:12px;}
  .p-foot .p-btn-view{flex:0 0 30%;}
  .p-foot .p-btn-edit{flex:0 0 70%;}
  .p-btn-dark{background:var(--primary-dark);color:#fff;border-color:var(--primary-dark);}
  .p-btn-dark:hover{background:#0D2A22;}
  .p-btn-gold{background:var(--gold);color:#fff;border-color:var(--gold);}
  .p-btn-gold:hover{background:#8F6520;}

  .progress-track{height:6px;background:var(--border-soft);border-radius:20px;overflow:hidden;margin:10px 0 12px;}
  .progress-fill{height:100%;border-radius:20px;background:var(--primary);}

  .section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:12px;flex-wrap:wrap;}
  .section-title{font-size:15.5px;font-weight:700;}
  .section-desc{font-size:12px;color:var(--text-faint);margin-top:2px;}

  table.dt{width:100%;border-collapse:collapse;font-size:13px;}
  table.dt th{text-align:right;font-size:11.5px;color:var(--text-faint);font-weight:600;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--surface-alt);}
  table.dt td{padding:13px 14px;border-bottom:1px solid var(--border-soft);vertical-align:middle;}
  table.dt tr:last-child td{border-bottom:none;}
  table.dt tr:hover td{background:var(--surface-alt);}

  /* DOC CARDS */
  .doc-card{border:1px solid var(--border);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;}
  .doc-card.rev{border-color:#EEDDB6;background:#FEFBF3;}
  .doc-card.missing{border-style:dashed;background:var(--surface-alt);}
  .doc-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
  .doc-icon{width:34px;height:34px;border-radius:9px;background:var(--info-light);color:var(--info);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .doc-icon svg{width:16px;height:16px;}
  .doc-name{font-weight:700;font-size:13px;}
  .doc-meta{font-size:11.5px;color:var(--text-faint);}
  .doc-actions{display:flex;gap:6px;margin-top:6px;}

  /* IDENTITY CARDS */
  .identity-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  @media (max-width:820px){.identity-grid{grid-template-columns:1fr;}}
  .id-card{padding:18px;position:relative;overflow:hidden;}
  .id-card-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .id-card-icon{width:38px;height:38px;border-radius:10px;background:var(--primary-light);color:var(--primary-dark);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .id-card-icon svg{width:19px;height:19px;}
  .id-card-titles{min-width:0;}
  .id-card-title{font-weight:800;font-size:13.5px;}
  .id-card-sub{font-size:11.5px;color:var(--text-faint);margin-top:1px;}
  .id-card-head .badge{margin-right:auto;flex-shrink:0;}
  .id-card-body{display:grid;gap:12px;}
  .id-card-locked .id-card-inner{filter:blur(5px);opacity:.55;pointer-events:none;user-select:none;}
  .id-card-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;background:linear-gradient(180deg, rgba(255,255,255,.25), rgba(255,255,255,.82));}
  .add-fab{width:46px;height:46px;border-radius:50%;background:var(--primary);color:#fff;border:none;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-md);transition:background .12s,transform .12s;}
  .add-fab svg{width:20px;height:20px;}
  .add-fab:hover{background:var(--primary-dark);transform:scale(1.05);}
  .id-card-overlay-title{font-size:13px;font-weight:800;color:var(--text);}
  .id-card-overlay-text{font-size:11.5px;color:var(--text-muted);max-width:230px;line-height:1.9;}

  /* LEGAL TEASER (company info tab) */
  .legal-teaser{position:relative;border-radius:var(--radius-sm);overflow:hidden;}
  .legal-teaser .legal-teaser-inner{filter:blur(5px);opacity:.5;pointer-events:none;user-select:none;}
  .legal-teaser-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:28px 20px;background:linear-gradient(180deg, rgba(255,255,255,.2), rgba(255,255,255,.85));}
  .legal-teaser-overlay .id-card-icon{width:52px;height:52px;}
  .legal-teaser-overlay .id-card-icon svg{width:24px;height:24px;}
  .legal-teaser-title{font-size:14.5px;font-weight:800;color:var(--text);}
  .legal-teaser-text{font-size:12.5px;color:var(--text-muted);max-width:340px;line-height:1.9;}

  .timeline{position:relative;padding-right:26px;}
  .timeline::before{content:'';position:absolute;right:9px;top:4px;bottom:4px;width:2px;background:var(--border);}
  .t-item{position:relative;padding-bottom:22px;}
  .t-item:last-child{padding-bottom:0;}
  .t-dot{position:absolute;right:-26px;top:2px;width:20px;height:20px;border-radius:50%;background:var(--primary-light);border:2px solid var(--surface);display:flex;align-items:center;justify-content:center;color:var(--primary-dark);}
  .t-dot svg{width:10px;height:10px;}
  .t-dot.pending{background:var(--warning-light);color:var(--warning);}
  .t-title{font-size:13px;font-weight:700;}
  .t-desc{font-size:12px;color:var(--text-faint);margin-top:2px;}
  .t-time{font-size:11px;color:var(--text-faint);margin-top:4px;}

  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .field{display:flex;flex-direction:column;gap:6px;}
  .field.full{grid-column:1/-1;}
  .field label{font-size:12.5px;font-weight:600;color:var(--text-muted);}
  .field input,.field select,.field textarea{border:1px solid var(--border);border-radius:9px;padding:10px 12px;background:var(--surface);color:var(--text);outline:none;transition:border-color .12s;}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);}
  .field input:disabled,.field input[readonly]{background:var(--surface-alt);color:var(--text-muted);cursor:not-allowed;}
  .field .hint{font-size:11px;color:var(--text-faint);}
  .upload-box{border:1.5px dashed var(--border);border-radius:12px;padding:22px;text-align:center;color:var(--text-faint);font-size:12.5px;background:var(--surface-alt);cursor:pointer;}
  .upload-box svg{width:22px;height:22px;margin-bottom:8px;color:var(--text-faint);}

  /* MODAL */
  .overlay{position:fixed;inset:0;background:rgba(15,17,21,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
  .modal{background:var(--surface);border-radius:18px;width:100%;max-width:760px;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 30px 60px -20px rgba(0,0,0,.35);}
  .modal.narrow{max-width:520px;}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--border);flex-shrink:0;}
  .modal-title{font-size:15px;font-weight:700;}
  .modal-close{width:30px;height:30px;border-radius:9px;border:1px solid var(--border);background:var(--surface-alt);display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .modal-close svg{width:14px;height:14px;}
  .modal-body{padding:22px;overflow-y:auto;}
  .modal-foot{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;border-top:1px solid var(--border);flex-shrink:0;gap:10px;}

  .stepper{display:flex;align-items:center;padding:0 22px;padding-top:16px;}
  .step{display:flex;align-items:center;gap:8px;flex:1;}
  .step-circle{width:26px;height:26px;border-radius:50%;background:var(--surface-alt);border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;color:var(--text-faint);flex-shrink:0;}
  .step.done .step-circle{background:var(--primary);border-color:var(--primary);color:#fff;}
  .step.current .step-circle{background:var(--primary-dark);border-color:var(--primary-dark);color:#fff;}
  .step-label{font-size:12px;font-weight:600;color:var(--text-faint);white-space:nowrap;}
  .step.done .step-label,.step.current .step-label{color:var(--text);}
  .step-line{flex:1;height:1.5px;background:var(--border);margin:0 6px;}

  .empty{text-align:center;padding:50px 20px;color:var(--text-faint);}
  .empty svg{width:34px;height:34px;margin-bottom:10px;color:var(--border);}
  .empty .t{font-size:13.5px;font-weight:700;color:var(--text-muted);margin-bottom:3px;}

  .notif-item{display:flex;gap:12px;padding:16px 18px;border-bottom:1px solid var(--border-soft);cursor:pointer;}
  .notif-item:last-child{border-bottom:none;}
  .notif-item.unread{background:var(--surface-alt);}
  .notif-item:hover{background:#F1F3F5;}
  .notif-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .notif-icon svg{width:16px;height:16px;}
  .notif-title{font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px;}
  .notif-title .unread-dot{width:7px;height:7px;border-radius:50%;background:var(--danger);}
  .notif-desc{font-size:12px;color:var(--text-faint);margin-top:2px;}
  .notif-time{font-size:11px;color:var(--text-faint);white-space:nowrap;}

  .acct-tabs{display:flex;flex-direction:column;gap:2px;width:190px;flex-shrink:0;}
  .acct-tab{padding:11px 14px;border-radius:10px;font-size:13px;font-weight:600;color:var(--text-muted);cursor:pointer;}
  .acct-tab:hover{background:var(--surface-alt);}
  .acct-tab.active{background:var(--primary-light);color:var(--primary-dark);}
  .acct-layout{display:flex;gap:24px;align-items:flex-start;}
  .kv-row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border-soft);font-size:13px;gap:12px;}

  .kv-row .v{font-weight:600;text-align:left;}

  .chart-wrap{width:100%;overflow-x:auto;}

  .chart-legend .lg-item{display:flex;align-items:center;gap:6px;}
  .chart-legend .lg-dot{width:10px;height:10px;border-radius:3px;}

  .bank-cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;}
  .bank-card{border-radius:16px;padding:18px 20px;color:#fff;min-height:120px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;}
  .bank-card::after{content:'';position:absolute;left:-30px;bottom:-30px;width:130px;height:130px;background:rgba(255,255,255,.08);border-radius:50%;}
  .bank-card .bc-top{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;position:relative;z-index:1;}
  .bank-card .bc-top svg{width:20px;height:20px;opacity:.9;}
  .bank-card .bc-number{font-size:16px;letter-spacing:1px;font-weight:700;margin:16px 0 8px;direction:ltr;text-align:right;position:relative;z-index:1;}
  .bank-card .bc-bottom{display:flex;justify-content:space-between;align-items:flex-end;font-size:11px;opacity:.92;position:relative;z-index:1;}
  .bank-card .bc-del{position:absolute;top:10px;left:10px;width:26px;height:26px;border-radius:8px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer;z-index:2;opacity:0;transition:opacity .12s;}
  .bank-card:hover .bc-del{opacity:1;}
  .bank-card .bc-del svg{width:13px;height:13px;}

  .gallery-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  .gallery-item{height:80px;border-radius:10px;position:relative;overflow:hidden;}
  .gallery-item.cover{outline:3px solid var(--gold);outline-offset:-3px;}
  .gallery-item .gi-label{position:absolute;top:6px;right:6px;background:var(--gold);color:#fff;font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:20px;}
  .gallery-item .gi-del{position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:7px;background:rgba(0,0,0,.55);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;transition:opacity .12s;}
  .gallery-item:hover .gi-del{opacity:1;}
  .gallery-item .gi-del svg{width:11px;height:11px;}
  .gallery-item .gi-setcover{position:absolute;bottom:4px;right:4px;background:rgba(255,255,255,.92);color:var(--text);font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:20px;cursor:pointer;opacity:0;transition:opacity .12s;}
  .gallery-item:hover .gi-setcover{opacity:1;}

  /* PAGINATION */
  .pager{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:20px;flex-wrap:wrap;}
  .pager button{min-width:34px;height:34px;padding:0 10px;border-radius:9px;border:1px solid var(--border);background:var(--surface);color:var(--text-muted);font-size:13px;font-weight:600;cursor:pointer;}
  .pager button:hover:not(:disabled){background:var(--surface-alt);color:var(--text);}
  .pager button.active{background:var(--primary-dark);border-color:var(--primary-dark);color:#fff;}
  .pager button:disabled{opacity:.45;cursor:not-allowed;}
  .pager .pager-info{font-size:12px;color:var(--text-faint);margin:0 8px;}

  /* TOAST */
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#1A1E24;color:#fff;padding:12px 20px;border-radius:12px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:10px;box-shadow:0 12px 32px -8px rgba(0,0,0,.4);z-index:200;opacity:0;transition:all .25s;max-width:420px;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast svg{width:16px;height:16px;flex-shrink:0;}
  .toast.toast-success svg{color:#6BD5A7;}
  .toast.toast-error{background:#5A1A14;}
  .toast.toast-error svg{color:#FFB8AC;}
  .toast.toast-info{background:#153A56;}
  .toast.toast-info svg{color:#9BCBF0;}

  /* CONFIRM */
  .confirm-modal{background:var(--surface);border-radius:18px;width:100%;max-width:440px;padding:24px;box-shadow:0 30px 60px -20px rgba(0,0,0,.35);}
  .confirm-icon{width:48px;height:48px;border-radius:14px;background:var(--danger-light);color:var(--danger);display:flex;align-items:center;justify-content:center;margin-bottom:14px;}

  .confirm-title{font-size:15px;font-weight:800;margin-bottom:6px;}
  .confirm-msg{font-size:13px;color:var(--text-muted);line-height:1.8;margin-bottom:20px;}
  .confirm-actions{display:flex;gap:8px;justify-content:flex-end;}

  .expert-box{background:var(--gold-light);border:1px solid #EEDDB6;border-radius:12px;padding:14px 16px;margin-top:6px;}

  .expert-box .ex-title svg{width:14px;height:14px;}
  .expert-box .ex-text{font-size:13px;color:var(--text);line-height:1.9;}
  .expert-box .ex-meta{font-size:11px;color:var(--text-faint);margin-top:8px;padding-top:8px;border-top:1px dashed #EEDDB6;}

  @media(max-width:1100px){

    .acct-layout{flex-direction:column;}
    .acct-tabs{flex-direction:row;width:100%;overflow-x:auto;}

  .stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:14px;}

  .stat-card .st-icon svg{width:17px;height:17px;}
  .stat-card .st-val{font-size:21px;font-weight:800;color:var(--text);}

  .tgl-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:15px 18px;border-bottom:1px solid var(--border-soft);}

  .log-sev.s-low{background:var(--surface-alt);color:var(--text-muted);}
  .role-picker{display:flex;gap:8px;flex-wrap:wrap;}

  .badge-info{background:var(--info-light);color:var(--info);}

/* ===================== HELPERS ===================== */
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmt(n){ return Number(n).toLocaleString('en-US'); }
function toFa(n){ return String(n).replace(/\d/g, d=>'۰۱۲۳۴۵۶۷۸۹'[d]); }
function money(n){ return toFa(fmt(n)) + ' تومان'; }
function findProject(id){ return PROJECTS.find(p=>p.id===id); }
function badge(map,status){ const m=map[status]||map.draft||{l:'—',c:'badge-draft'}; return `<span class="badge ${m.c}">${m.l}</span>`; }
function roleChip(role){ const m=ROLE_META[role]||{l:'—',c:''}; return `<span class="role-chip ${m.c}">${m.l}</span>`; }
function unreadCount(){ return NOTIFS.filter(n=>n.unread && !state.notifRead.has(n.id)).length; }
function pendingRel(){ return RELEASES.filter(r=>r.status==='pending').length; }
function pendingKyc(){ return KYCS.filter(k=>k.status==='pending').length; }
function pendingReports(){ return REPORTS.filter(r=>r.status==='pending').length; }
function emptyState(title, desc, btnLabel, btnAction){
  return `<div class="empty">${I.doc}<div class="t">${esc(title)}</div>
    ${desc?`<div style="font-size:12px;max-width:340px;margin:0 auto;line-height:1.9;">${esc(desc)}</div>`:''}
    ${btnLabel?`<button class="btn btn-soft btn-sm" style="margin-top:14px;" data-action="${btnAction}">${btnLabel}</button>`:''}</div>`;
}

function showToast(msg, type='success'){
  const el = document.createElement('div');
  el.className = 'toast toast-'+type;
  const icon = type==='error' ? I.warn : type==='info' ? I.info : I.check;
  el.innerHTML = icon + '<span>'+esc(msg)+'</span>';
  document.body.appendChild(el);
  requestAnimationFrame(()=> el.classList.add('show'));
  setTimeout(()=>{ el.classList.remove('show'); setTimeout(()=> el.remove(), 280); }, 2800);
}
function showConfirm({title, msg, confirmLabel='حذف', onConfirm}){
  state.confirm = {title, msg, confirmLabel, onConfirm}; render();
}
function closeConfirm(){ state.confirm=null; render(); }

function renderModal(){
  const m = state.modal;
  if(m.type==='req'){ const r = findReq(m.id); if(!r) return ''; return state.modal.extra==='exec' ? execModal(r) : requestModal(r); }
  if(m.type==='market'){ const m2 = findMkt(m.id); if(!m2) return '';
    return state.modal.extra==='match' ? mktMatchModal(m2) : state.modal.extra==='settle' ? mktSettleModal(m2) : marketModal(m2); }
  if(m.type==='release'){ const r = findRel(m.id); if(!r) return ''; return state.modal.extra==='exec' ? relExecModal(r) : releaseModal(r); }
  if(m.type==='report'){ const r = findReport(m.id); return r? reportModal(r):''; }
  if(m.type==='kyc'){ const k = findKyc(m.id); return k? kycModal(k):''; }
  if(m.type==='notif'){ const n = findNotif(m.id); return n? notifModal(n):''; }
  if(m.type==='pass'){ return passModal(); }
  return '';
}

function renderModal(){
  const m = state.modal;
  if(m.type==='builder'){ const b = BUILDERS.find(x=>x.id===m.id); return b? builderModal(b):''; }
  if(m.type==='ticket'){ const t = TICKETS.find(x=>x.id===m.id); return t? ticketModal(t):''; }
  if(m.type==='entry'){ return entryModal(m.id? ENTRIES.find(x=>x.id===m.id):null, m.extra==='new'); }
  if(m.type==='buyer'){
    const [pid, idx] = (m.id||'').split(':');
    const b = (BUYERS[pid]||[])[+idx];
    return b? buyerModal(b.n, b.p, pid):'';
  }
  if(m.type==='user'){ const u = USERS.find(x=>x.id===m.id); return u? userModal(u):''; }
  if(m.type==='staff'){ return state.modal.extra==='new' ? staffModal(null,true) : (function(){ const st = STAFF.find(x=>x.id===m.id); return st? staffModal(st,false):''; })(); }
  if(m.type==='suspend'){ const st = STAFF.find(x=>x.id===m.id); return st? suspendModal(st):''; }
  if(m.type==='revise'){ const p = findProject(m.id); return p? reviseModal(p):''; }
  if(m.type==='req'){ const r = findReq(m.id); if(!r) return ''; return state.modal.extra==='exec' ? execModal(r) : requestModal(r); }
  if(m.type==='market'){ const m2 = findMkt(m.id); if(!m2) return '';
    return state.modal.extra==='match' ? mktMatchModal(m2) : state.modal.extra==='settle' ? mktSettleModal(m2) : marketModal(m2); }
  if(m.type==='release'){ const r = findRel(m.id); if(!r) return ''; return state.modal.extra==='exec' ? relExecModal(r) : releaseModal(r); }
  if(m.type==='report'){ const r = REPORTS.find(x=>x.id===m.id); return r? reportModal(r):''; }
  if(m.type==='kyc'){ const k = KYCS.find(x=>x.id===m.id); return k? kycModal(k):''; }
  if(m.type==='notif'){ const n = NOTIFS.find(x=>x.id===m.id); return n? notifModal(n):''; }
  if(m.type==='pass'){ return passModal(); }
  return '';
}

/* ===================== EVENTS ===================== */
function stamp(){ return '۱۴۰۳/۰۷/۱۸ — ۰۹:۳۰'; }
function faToNum(s){ return String(s).replace(/[۰-۹]/g, d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)); }
function onlyDigits(s){ return faToNum(s).replace(/[^0-9]/g,''); }
function refocus(field, val){
  const el = document.querySelector('[data-field="'+field+'"]');
  if(el){ el.focus(); try{ el.setSelectionRange(val.length, val.length); }catch(_){ } }
}
function bindEvents(){
  const app = document.getElementById('app');
  if(app._bound) return;
  app._bound = true;

  app.addEventListener('click', e=>{
    const el = e.target.closest('[data-action]');
    if(!el) return;
    const a = el.dataset.action, id = el.dataset.id;
    const modalEl = app.querySelector('.modal');
    const fld = n => { const x = modalEl && modalEl.querySelector('[data-field="'+n+'"]'); return x ? x.value : ''; };

    if(a==='close-modal-bg'){ if(e.target===el){ if(state.confirm){ state.confirm=null; } else { closeModal(); } render(); } return; }
    if(a==='close-modal'){ closeModal(); state.confirm=null; render(); return; }
    if(a==='confirm-no'){ state.confirm=null; render(); return; }
    if(a==='confirm-yes'){ const c=state.confirm; state.confirm=null; if(c&&c.onConfirm) c.onConfirm(); render(); return; }

    if(a==='nav' || a.indexOf('nav-')===0){
      state.view = a==='nav' ? el.dataset.view : a.slice(4);
      state.selectedProject=null; render(); return;
    }
    if(a==='back-projects'){ state.selectedProject=null; render(); return; }
    if(a==='open-project'){ state.selectedProject=id; state.projectTab = findProject(id).status==='pending' ? 'settings':'overview'; render(); return; }
    if(a==='project-tab'){ state.projectTab=el.dataset.tab; render(); return; }
    if(a==='proj-tab'){ state.projStatus=el.dataset.tab; render(); return; }
    if(a==='rel-tab'){ state.relTab=el.dataset.tab; render(); return; }
    if(a==='rel-sub'){ state.relSub=el.dataset.tab; render(); return; }
    if(a==='kyc-tab'){ state.kycTab=el.dataset.tab; render(); return; }
    if(a==='notif-tab'){ state.notifTab=el.dataset.tab; render(); return; }
    if(a==='acct-tab'){ state.acctTab=el.dataset.tab; render(); return; }
    if(a==='builder-tab'){ state.builderTab=el.dataset.tab; render(); return; }
    if(a==='ticket-tab'){ state.ticketTab=el.dataset.tab; render(); return; }
    if(a==='content-tab'){ state.contentTab=el.dataset.tab; render(); return; }
    if(a==='buyer-project'){ state.buyerProject=el.dataset.tab; render(); return; }

    if(a==='open-builder'){ state.modal={type:'builder',id,extra:null}; render(); return; }
    if(a==='open-ticket'){ state.modal={type:'ticket',id,extra:null}; render(); return; }
    if(a==='open-buyer'){ state.modal={type:'buyer',id,extra:null}; render(); return; }
    if(a==='open-release'){ state.modal={type:'release',id,extra:null}; render(); return; }
    if(a==='open-report'){ state.modal={type:'report',id,extra:null}; render(); return; }
    if(a==='open-kyc'){ state.modal={type:'kyc',id,extra:null}; render(); return; }
    if(a==='notif-open'){ state.notifRead.add(id); state.modal={type:'notif',id,extra:null}; render(); return; }
    if(a==='notif-read-all'){ NOTIFS.forEach(n=>state.notifRead.add(n.id)); showToast('همه اعلان‌ها خوانده شدند','info'); render(); return; }

    if(a==='builder-approve' || a==='builder-reject'){
      const b = BUILDERS.find(x=>x.id===id);
      if(a==='builder-approve'){
        modalEl.querySelectorAll('[data-field="b-doc"]').forEach(sel=>{ const d=b.docs.find(x=>x.n===sel.dataset.name); if(d) d.s=sel.value; });
        const bad = b.docs.filter(d=>d.s==='rejected').length;
        if(bad>0){ showToast(toFa(bad)+' مدرک رد شد — تأیید نهایی ممکن نشد','error'); return; }
        b.status='approved'; showToast('انبوه‌ساز تأیید شد و می‌تواند پروژه ثبت کند');
      } else {
        const reason = fld('b-reason').trim();
        if(!reason){ showToast('برای رد درخواست، ثبت دلیل الزامی است','error'); return; }
        b.status='rejected'; b.reason=reason;
        showToast('درخواست رد شد و دلیل برای کاربر ارسال شد','info');
      }
      closeModal(); render(); return;
    }

    if(a==='save-tokens'){
      const p = findProject(id);
      const cnt = onlyDigits(fld('token-count')), price = onlyDigits(fld('token-price'));
      if(!cnt || +cnt < 1){ showToast('تعداد خشت‌ها باید عددی بزرگتر از صفر باشد','error'); return; }
      if(!price || +price < 1000000){ showToast('قیمت هر خشت را به تومان وارد کنید (حداقل ۱ میلیون)','error'); return; }
      if(p.sold > +cnt){ showToast('تعداد خشت نمی‌تواند کمتر از خشت‌های فروخته‌شده ('+toFa(p.sold)+' عدد) باشد','error'); return; }
      p.totalTokens = +cnt; p.tokenPrice = +price; p.nextUpdate = fld('token-next-update').trim() || '۱۴۰۳/۰۸/۰۱';
      if(p.status==='pending') p.status='active';
      closeModal(); showToast('تنظیمات خشت پروژه ثبت و پروژه منتشر شد'); render(); return;
    }
    if(a==='update-price'){
      const p = findProject(id), price = onlyDigits(fld('token-price'));
      if(!price || +price < 1000000){ showToast('قیمت هر خشت را به تومان وارد کنید','error'); return; }
      p.tokenPrice = +price; p.nextUpdate = fld('token-next-update').trim() || '۱۴۰۳/۰۸/۰۱';
      closeModal(); showToast('قیمت هر خشت برای ماه جدید به‌روزرسانی شد'); render(); return;
    }
    if(a==='revise-project'){ state.modal={type:'revise',id,extra:null}; render(); return; }
    if(a==='revise-submit'){
      const p = findProject(id), reason = fld('revise-reason').trim();
      if(!reason){ showToast('دلیل درخواست اصلاح را وارد کنید','error'); return; }
      p.status='revision'; p.reviseReason = reason;
      closeModal(); showToast('پروژه به حالت «نیازمند اصلاح» درآمد و به انبوه‌ساز اطلاع داده شد','info'); render(); return;
    }

    if(a==='ticket-reply'){
      const t = TICKETS.find(x=>x.id===id), text = fld('tk-reply').trim();
      if(!text){ showToast('متن پاسخ را وارد کنید','error'); return; }
      t.msgs.push({from:ACCOUNT.name, me:true, t:stamp(), text});
      t.status='answered'; t.time = stamp();
      showToast('پاسخ ارسال شد'); render(); return;
    }
    if(a==='ticket-close'){
      const t = TICKETS.find(x=>x.id===id);
      t.status='closed'; closeModal(); showToast('تیکت بسته شد','info'); render(); return;
    }

    if(a==='new-entry'){ state.modal={type:'entry',id:null,extra:'new'}; render(); return; }
    if(a==='edit-entry'){ state.modal={type:'entry',id,extra:null}; render(); return; }
    if(a==='entry-save'){
      const title = fld('e-title').trim(), cat = fld('e-cat'), st = fld('e-status'), body = fld('e-body').trim();
      if(!title){ showToast('عنوان مقاله را وارد کنید','error'); return; }
      if(el.dataset.new==='1'){
        const nid = 'e'+(ENTRIES.length+1);
        ENTRIES.push({id:nid, title, cat, status:st, views:0, date:'۱۴۰۳/۰۷/۱۸', body});
        showToast('مقاله جدید در سایت منتشر شد');
      } else {
        const en = ENTRIES.find(x=>x.id===id);
        if(en){ en.title=title; en.cat=cat; en.status=st; en.body=body; }
        showToast('مقاله به‌روزرسانی شد');
      }
      closeModal(); render(); return;
    }
    if(a==='del-entry'){
      const en = ENTRIES.find(x=>x.id===id);
      showConfirm({title:'حذف مقاله', msg:'مقاله «'+en.title+'» از سایت حذف شود؟', confirmLabel:'حذف مقاله',
        onConfirm:()=>{ ENTRIES.splice(ENTRIES.indexOf(en),1); showToast('مقاله حذف شد','info'); }});
      return;
    }

    if(a==='req-tab'){ state.reqTab=el.dataset.tab; render(); return; }
    if(a==='open-req'){ state.modal={type:'req',id,extra:null}; render(); return; }
    if(a==='req-approve'){
      const r = findReq(id);
      r.status='approved';
      showToast('درخواست '+r.ref+' تأیید شد — اکنون در مرحله انجام دستی قرار دارد');
      closeModal(); render(); return;
    }
    if(a==='req-reject'){
      const r = findReq(id), reason = fld('req-reason').trim();
      if(!reason){ showToast('برای رد درخواست، ثبت دلیل الزامی است','error'); return; }
      r.status='rejected'; r.reason=reason;
      showToast('درخواست رد شد و دلیل آن برای کاربر ارسال شد','info');
      closeModal(); render(); return;
    }
    if(a==='req-exec'){ state.modal.extra='exec'; render(); return; }
    if(a==='modal-back'){ state.modal.extra=null; render(); return; }
    if(a==='req-exec-save'){
      const r = findReq(id), receipt = fld('ex-receipt').trim(), date = fld('ex-date').trim(), note = fld('ex-note').trim();
      if(!receipt){ showToast('شماره رسید / فیش بانکی الزامی است','error'); return; }
      if(!date){ showToast('تاریخ انجام را ثبت کنید','error'); return; }
      r.exec = {by:ACCOUNT.name, receipt, date, note:note||'—'};
      r.status='done';
      showToast('رسید ثبت شد و درخواست '+r.ref+' تکمیل شد');
      closeModal(); render(); return;
    }
    if(a==='mkt-tab'){ state.mktTab=el.dataset.tab; render(); return; }
    if(a==='open-market'){ state.modal={type:'market',id,extra:null}; render(); return; }
    if(a==='mkt-approve'){
      const m = findMkt(id);
      m.status='active';
      showToast('عرضه تأیید و در بازار ثانویه فعال شد');
      closeModal(); render(); return;
    }
    if(a==='mkt-reject'){
      const m = findMkt(id), reason = fld('mkt-reason').trim();
      if(!reason){ showToast('برای رد عرضه، ثبت دلیل الزامی است','error'); return; }
      m.status='rejected'; m.reason=reason;
      showToast('عرضه رد شد و دلیل آن برای فروشنده ارسال شد','info');
      closeModal(); render(); return;
    }
    if(a==='mkt-match'){ state.modal={type:'market',id,extra:'match'}; render(); return; }
    if(a==='mkt-match-save'){
      const m = findMkt(id), buyer = fld('mk-buyer').trim(), date = fld('mk-date').trim();
      if(!buyer){ showToast('نام خریدار را ثبت کنید','error'); return; }
      m.buyer=buyer; m.date = date||stamp(); m.status='settle';
      showToast('معامله ثبت شد — اکنون نیازمند تسویه دستی است');
      closeModal(); render(); return;
    }
    if(a==='mkt-settle'){ state.modal={type:'market',id,extra:'settle'}; render(); return; }
    if(a==='mkt-settle-save'){
      const m = findMkt(id), receipt = fld('ms-receipt').trim(), date = fld('ms-date').trim(), note = fld('ms-note').trim();
      if(!receipt){ showToast('شماره رسید / فیش واریز الزامی است','error'); return; }
      m.exec = {by:ACCOUNT.name, receipt, date:date||stamp(), note:note||'—'};
      m.status='done';
      showToast('تسویه بازار ثانویه ثبت شد و خشت‌ها به خریدار منتقل گردید');
      closeModal(); render(); return;
    }
    if(a==='rel-exec'){ state.modal.extra='exec'; render(); return; }
    if(a==='rel-exec-save'){
      const r = findRel(id), receipt = fld('rl-receipt').trim(), date = fld('rl-date').trim(), note = fld('rl-note').trim();
      if(!receipt){ showToast('شماره رسید / فیش واریز الزامی است','error'); return; }
      r.exec = {by:ACCOUNT.name, receipt, date:date||stamp(), note:note||'—'};
      r.status='done';
      showToast('رسید واریز ثبت شد و وجه مرحله «'+r.phase+'» آزاد شد');
      closeModal(); render(); return;
    }
    if(a==='rel-approve' || a==='rel-reject' || a==='rel-hold'){
      const r = RELEASES.find(x=>x.id===id), reason = fld('rel-reason').trim();
      if(a==='rel-approve'){ r.status='approved'; showToast('آزادسازی وجه مرحله «'+r.phase+'» تأیید شد — اکنون در مرحله انجام دستی است'); }
      else {
        if(!reason){ showToast(a==='rel-hold'?'برای تعلیق درخواست، ثبت دلیل الزامی است':'برای رد درخواست، ثبت دلیل الزامی است','error'); return; }
        r.status = a==='rel-hold' ? 'hold' : 'rejected'; r.note = reason;
        showToast(a==='rel-hold'?'درخواست آزادسازی وجه معلق شد':'درخواست آزادسازی وجه رد شد','info');
      }
      closeModal(); render(); return;
    }
    if(a==='rp-approve' || a==='rp-reject'){
      const rp = REPORTS.find(x=>x.id===id);
      if(a==='rp-approve'){ rp.status='approved'; showToast('گزارش ماهانه تأیید شد'); }
      else {
        const reason = fld('rp-reason').trim();
        if(!reason){ showToast('برای رد گزارش، ثبت دلیل الزامی است','error'); return; }
        rp.status='rejected'; rp.reason=reason;
        showToast('گزارش ماهانه رد شد','info');
      }
      closeModal(); render(); return;
    }
    if(a==='kyc-approve'){
      const k = KYCS.find(x=>x.id===id);
      modalEl.querySelectorAll('[data-field="kyc-doc"]').forEach(sel=>{ k.docs[+sel.dataset.idx].s = sel.value; });
      const bad = k.docs.filter(d=>d.s==='rejected').length;
      if(bad>0){ k.status='pending'; showToast(toFa(bad)+' مدرک رد شد — احراز هویت کامل نشد','error'); }
      else { k.status='verified'; showToast('احراز هویت تأیید و حساب کاربر فعال شد'); }
      closeModal(); render(); return;
    }
    if(a==='kyc-reject'){
      const k = KYCS.find(x=>x.id===id), reason = fld('kyc-reason').trim();
      if(!reason){ showToast('برای رد مدارک، ثبت دلیل الزامی است','error'); return; }
      k.status='rejected'; k.reason=reason;
      showToast('مدارک رد شد و دلیل برای کاربر ارسال شد','info'); closeModal(); render(); return;
    }
    if(a==='user-tab'){ state.userTab=el.dataset.tab; render(); return; }
    if(a==='staff-tab'){ state.staffTab=el.dataset.tab; render(); return; }
    if(a==='staff-pick'){ if(state.modal.extra==='new'){ state.staffPick=id; render(); } return; }
    if(a==='open-user'){ state.modal={type:'user',id,extra:null}; render(); return; }
    if(a==='new-staff'){ state.staffPick=null; state.modal={type:'staff',id:null,extra:'new'}; render(); return; }
    if(a==='edit-staff'){ state.staffPick=null; state.modal={type:'staff',id,extra:null}; render(); return; }
    if(a==='suspend-staff'){ state.modal={type:'suspend',id,extra:null}; render(); return; }

    if(a==='staff-save'){
      const name = fld('s-name').trim(), emp = fld('s-emp').trim(), phone = fld('s-phone').trim(),
            email = fld('s-email').trim(), dept = fld('s-dept').trim(), pass = fld('s-pass');
      if(!name || !emp || !phone || !email || !dept){ showToast('تمام فیلدها را پر کنید','error'); return; }
      if(el.dataset.new==='1'){
        if(!pass || pass.length<8){ showToast('رمز عبور اولیه باید حداقل ۸ کاراکتر باشد','error'); return; }
        const role = state.staffPick || 'expert';
        if(STAFF.some(x=>x.emp===emp)){ showToast('این کد کارمندی قبلاً ثبت شده است','error'); return; }
        STAFF.push({id:'s'+(STAFF.length+1), name, role, emp, phone, email, dept, pass,
          status:'active', twoFA:true, joined:'۱۴۰۳/۰۷/۱۸', lastLogin:'—'});
        SEC_LOG.unshift({id:'l'+(SEC_LOG.length+1), sev:'high', who:ACCOUNT.name+' ('+ACCOUNT.emp+')',
          act:'ایجاد حساب '+(role==='admin'?'ادمین':'کارشناس')+' جدید برای «'+name+'» با کد کارمندی '+emp, time:stamp(), ip:'۱۹۲٫۱۶۸٫۱٫۱۰'});
        showToast('حساب کارمند جدید ایجاد شد و رمز اولیه برای او پیامک شد');
      } else {
        const s = STAFF.find(x=>x.id===id);
        if(s){ s.name=name; s.emp=emp; s.phone=phone; s.email=email; s.dept=dept; s.status=fld('s-status');
          if(pass) s.pass=pass; }
        showToast('اطلاعات حساب کارمند به‌روزرسانی شد');
      }
      closeModal(); render(); return;
    }
    if(a==='suspend-submit'){
      const s = STAFF.find(x=>x.id===id), reason = fld('sp-reason').trim();
      if(!reason){ showToast('علت تعلیق را وارد کنید','error'); return; }
      s.status='suspended'; s.suspendReason=reason;
      SEC_LOG.unshift({id:'l'+(SEC_LOG.length+1), sev:'med', who:ACCOUNT.name+' ('+ACCOUNT.emp+')',
        act:'تعلیق حساب کارمند «'+s.name+'» ('+s.emp+') — '+reason, time:stamp(), ip:'۱۹۲٫۱۶۸٫۱٫۱۰'});
      closeModal(); showToast('حساب کارمند معلق شد','info'); render(); return;
    }
    if(a==='restore-staff'){
      const s = STAFF.find(x=>x.id===id);
      showConfirm({title:'رفع تعلیق', msg:'حساب «'+s.name+'» دوباره فعال شود؟', confirmLabel:'فعال‌سازی',
        onConfirm:()=>{ s.status='active'; s.suspendReason=null; showToast('حساب کارمند فعال شد'); }});
      return;
    }
    if(a==='del-staff'){
      const s = STAFF.find(x=>x.id===id);
      showConfirm({title:'حذف حساب کارمند', msg:'حساب «'+s.name+'» ('+s.emp+') به‌طور کامل حذف می‌شود و دیگر نمی‌تواند وارد پنل شود. ادامه می‌دهید؟', confirmLabel:'حذف حساب',
        onConfirm:()=>{
          SEC_LOG.unshift({id:'l'+(SEC_LOG.length+1), sev:'high', who:ACCOUNT.name+' ('+ACCOUNT.emp+')',
            act:'حذف حساب کارمند «'+s.name+'» ('+s.emp+')', time:stamp(), ip:'۱۹۲٫۱۶۸٫۱٫۱۰'});
          STAFF.splice(STAFF.indexOf(s),1); showToast('حساب کارمند حذف شد','info'); }});
      return;
    }

    if(a==='block-user'){
      const u = USERS.find(x=>x.id===id), reason = fld('u-reason').trim(), type = fld('u-block-type');
      if(!reason){ showToast('ثبت علت مسدودسازی الزامی است','error'); return; }
      u.status = type; u.blockReason = reason;
      u.blockUntil = type==='blockedTemp' ? '۱۴۰۳/۰۷/۱۹' : null;
      SEC_LOG.unshift({id:'l'+(SEC_LOG.length+1), sev:'high', who:ACCOUNT.name+' ('+ACCOUNT.emp+')',
        act:(type==='blockedPerm'?'مسدودسازی دائم':'مسدودسازی موقت')+' حساب «'+u.name+'» — '+reason, time:stamp(), ip:'۱۹۲٫۱۶۸٫۱٫۱۰'});
      closeModal(); showToast(type==='blockedPerm'?'حساب کاربر به‌طور دائم مسدود شد':'حساب کاربر به‌مدت ۲۴ ساعت مسدود شد','info'); render(); return;
    }
    if(a==='unblock-user'){
      const u = USERS.find(x=>x.id===id);
      showConfirm({title:'رفع مسدودسازی', msg:'حساب «'+u.name+'» دوباره فعال می‌شود؟', confirmLabel:'فعال‌سازی',
        onConfirm:()=>{ u.status='active'; u.blockReason=null; u.blockUntil=null;
          showToast('مسدودسازی حساب لغو شد'); }});
      return;
    }
    if(a==='save-user'){
      const u = USERS.find(x=>x.id===id), nr = fld('u-role'), reason = fld('u-reason').trim();
      if(nr!==u.role){
        SEC_LOG.unshift({id:'l'+(SEC_LOG.length+1), sev:'high', who:ACCOUNT.name+' ('+ACCOUNT.emp+')',
          act:'تغییر سطح دسترسی «'+u.name+'» از «'+(ROLE_META[u.role]||{}).l+'» به «'+(ROLE_META[nr]||{}).l+'»', time:stamp(), ip:'۱۹۲٫۱۶۸٫۱٫۱۰'});
        u.role = nr; showToast('سطح دسترسی کاربر تغییر کرد');
      } else { showToast('اطلاعات حساب کاربر ذخیره شد'); }
      closeModal(); render(); return;
    }
    if(a==='del-user'){
      const u = USERS.find(x=>x.id===id);
      showConfirm({title:'حذف حساب کاربر', msg:'حساب «'+u.name+'» و تمام اطلاعات مرتبط حذف می‌شود. این عمل قابل بازگشت نیست.', confirmLabel:'حذف قطعی',
        onConfirm:()=>{
          SEC_LOG.unshift({id:'l'+(SEC_LOG.length+1), sev:'high', who:ACCOUNT.name+' ('+ACCOUNT.emp+')',
            act:'حذف حساب کاربر «'+u.name+'» (کد ملی '+u.national+')', time:stamp(), ip:'۱۹۲٫۱۶۸٫۱٫۱۰'});
          u.status='deleted'; showToast('حساب کاربر حذف شد','info'); }});
      return;
    }
    if(a==='sec-tgl'){
      const key = el.dataset.key;
      state.tgl[key] = !state.tgl[key];
      if(key==='force2fa' && !state.tgl[key]) showToast('غیرفعال‌سازی تأیید دومرحله‌ای توصیه نمی‌شود','info');
      else showToast(state.tgl[key]?'تنظیم امنیتی فعال شد':'تنظیم امنیتی غیرفعال شد', state.tgl[key]?'success':'info');
      render(); return;
    }
    if(a==='tgl'){
      const key = el.dataset.key;
      state.tgl[key] = !state.tgl[key];
      showToast(state.tgl[key]?'گزینه فعال شد':'گزینه غیرفعال شد','info'); render(); return;
    }
    if(a==='save-account'){ showToast('اطلاعات کارمندی ذخیره شد'); return; }
    if(a==='chg-pass'){ state.modal={type:'pass',id:null,extra:null}; render(); return; }
    if(a==='pass-save'){
      const cur=fld('cur-pass'), np=fld('new-pass'), rp=fld('rep-pass');
      if(!cur||!np||!rp){ showToast('تمام فیلدها را پر کنید','error'); return; }
      if(np.length<8){ showToast('رمز عبور جدید باید حداقل ۸ کاراکتر باشد','error'); return; }
      if(np!==rp){ showToast('تکرار رمز عبور با رمز جدید مطابقت ندارد','error'); return; }
      closeModal(); showToast('رمز عبور با موفقیت تغییر کرد'); render(); return;
    }
  });

  app.addEventListener('input', e=>{
    const f = e.target.dataset && e.target.dataset.field;
    if(f==='proj-search'){ state.projSearch = e.target.value; render(); refocus('proj-search', e.target.value); return; }
    if(f==='req-search'){ state.reqSearch = e.target.value; render(); refocus('req-search', e.target.value); return; }
    if(f==='user-search'){ state.userSearch = e.target.value; render(); refocus('user-search', e.target.value); return; }
  });
}

render();
</script>
</body>
</html>
