<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پنل سرمایه‌گذار</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4F5F7; --surface:#FFFFFF; --surface-alt:#FAFBFC; --border:#E7E9EC; --border-soft:#EFF1F3;
    --text:#181B20; --text-muted:#5B6472; --text-faint:#818A96;
    --primary:#1F5C4C; --primary-dark:#153F34; --primary-light:#E6F0EC;
    --gold:#AD7C2B; --gold-light:#F8EFDD;
    --danger:#B3392C; --danger-light:#FBEAE7;
    --warning:#B07A1E; --warning-light:#FAF0DC;
    --info:#2B5A82; --info-light:#E8F0F7;
    --up:#1F7A4D; --up-light:#E6F4EC;
    --down:#B3392C;
    --radius:16px; --radius-sm:10px;
    --shadow-sm:0 1px 2px rgba(20,23,28,.06);
    --shadow-md:0 14px 34px -16px rgba(20,23,28,.24);
    --shadow-lg:0 24px 60px -20px rgba(20,23,28,.30);
    --focus-ring:0 0 0 3px var(--primary-light);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  svg{width:18px;height:18px;flex-shrink:0;}
  body{font-family:'Vazirmatn',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.7;-webkit-font-smoothing:antialiased;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:#D7DBE0;border-radius:8px;}
  ::-webkit-scrollbar-thumb:hover{background:#C3C9D1;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;}
  html{color-scheme:light;}
  input,textarea,select{font-family:inherit;font-size:13.5px;}
  select{color:var(--text);background-color:var(--surface);}
  select option{color:var(--text);background-color:#fff;}
  :focus-visible{outline:none;box-shadow:var(--focus-ring);border-radius:8px;}
  button:focus-visible,.nav-item:focus-visible,.tab:focus-visible,.chip:focus-visible{box-shadow:var(--focus-ring);}

  .app{display:flex;min-height:100vh;}

  /* SIDEBAR */
  .sidebar{width:250px;flex:0 0 250px;background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;}
  .brand{padding:22px 20px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border-soft);}
  .brand-mark{width:36px;height:36px;border-radius:10px;background:linear-gradient(155deg,var(--primary),var(--primary-dark));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:15px;flex-shrink:0;}
  .brand-name{font-weight:700;font-size:14.5px;color:var(--text);}
  .brand-sub{font-size:11.5px;color:var(--text-faint);margin-top:1px;}

  .nav{padding:14px 12px;display:flex;flex-direction:column;gap:2px;flex:1;overflow-y:auto;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--text-muted);font-size:13.5px;font-weight:500;cursor:pointer;position:relative;transition:background .12s,color .12s;}
  .nav-item svg{width:18px;height:18px;flex-shrink:0;}
  .nav-item:hover{background:var(--surface-alt);color:var(--text);}
  .nav-item.active{background:var(--primary-light);color:var(--primary-dark);font-weight:700;}
  .nav-item.soon{opacity:.62;}
  .nav-item.soon:hover{opacity:1;}
  .nav-badge{margin-right:auto;background:var(--danger);color:#fff;font-size:10.5px;font-weight:700;border-radius:20px;min-width:18px;height:18px;display:flex;align-items:center;justify-content:center;padding:0 5px;}
  .nav-badge.muted{background:var(--gold);}
  .nav-soon-chip{margin-right:auto;font-size:9.5px;font-weight:800;color:var(--gold);background:var(--gold-light);padding:2px 7px;border-radius:20px;letter-spacing:.2px;}

  .sidebar-foot{padding:14px;border-top:1px solid var(--border-soft);display:flex;align-items:center;gap:10px;}
  .avatar{width:34px;height:34px;border-radius:50%;background:var(--gold-light);color:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12.5px;flex-shrink:0;}
  .sidebar-foot .name{font-size:12.5px;font-weight:700;}
  .sidebar-foot .role{font-size:11px;color:var(--text-faint);}

  /* MAIN */
  .main{flex:1;min-width:0;display:flex;flex-direction:column;}
  .topbar{height:64px;flex:0 0 64px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 26px;position:sticky;top:0;z-index:20;gap:14px;}
  .page-title{font-size:16px;font-weight:700;}
  .page-sub{font-size:12px;color:var(--text-faint);margin-top:1px;}
  .topbar-right{display:flex;align-items:center;gap:12px;}
  .icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--text-muted);position:relative;cursor:pointer;}
  .icon-btn:hover{background:var(--surface-alt);}
  .icon-btn svg{width:17px;height:17px;}
  .dot-flag{position:absolute;top:-4px;left:-4px;min-width:18px;height:18px;padding:0 5px;border-radius:20px;background:var(--danger);color:#fff;font-size:10.5px;font-weight:700;border:1.5px solid var(--surface);display:flex;align-items:center;justify-content:center;}

  .content{padding:20px 26px 60px;flex:1;}

  /* GENERIC */
  .btn{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:10px;font-size:13px;font-weight:600;border:1px solid transparent;white-space:nowrap;transition:all .12s;}
  .btn:active:not(:disabled){transform:scale(.97);}
  .btn svg{width:15px;height:15px;}
  .btn-primary{background:var(--primary);color:#fff;}
  .btn-primary:hover{background:var(--primary-dark);}
  .btn-primary:disabled{background:#B9C4BF;cursor:not-allowed;}
  .btn-ghost{background:var(--surface);color:var(--text);border-color:var(--border);}
  .btn-ghost:hover{background:var(--surface-alt);}
  .btn-soft{background:var(--primary-light);color:var(--primary-dark);}
  .btn-danger-soft{background:var(--danger-light);color:var(--danger);}
  .btn-danger-soft:hover{background:#F5D5D0;}
  .btn-gold{background:var(--gold);color:#fff;}
  .btn-gold:hover{background:#8F6520;}
  .btn-sm{padding:6px 11px;font-size:12px;border-radius:8px;}
  .btn-block{width:100%;justify-content:center;}

  .badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:20px;line-height:1.4;}
  .badge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;}
  .badge-active{background:var(--primary-light);color:var(--primary-dark);}
  .badge-pending{background:var(--warning-light);color:var(--warning);}
  .badge-rejected,.badge-failed{background:var(--danger-light);color:var(--danger);}
  .badge-cancelled{background:#EEF0F2;color:var(--text-muted);}
  .badge-draft{background:#EEF0F2;color:var(--text-muted);}
  .badge-done{background:var(--info-light);color:var(--info);}
  .badge-up{background:var(--up-light);color:var(--up);}
  .badge-down{background:var(--danger-light);color:var(--down);}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);transition:border-color .15s,box-shadow .15s;}
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:22px;overflow-x:auto;}
  .tab{padding:11px 16px;font-size:13.5px;font-weight:600;color:var(--text-faint);border-bottom:2px solid transparent;white-space:nowrap;cursor:pointer;}
  .tab:hover{color:var(--text);}
  .tab.active{color:var(--primary-dark);border-color:var(--primary);}
  .tab .count{background:var(--surface-alt);color:var(--text-faint);font-size:11px;padding:1px 7px;border-radius:20px;margin-right:6px;}
  .tab.active .count{background:var(--primary-light);color:var(--primary-dark);}

  .section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:12px;flex-wrap:wrap;}
  .section-title{font-size:15.5px;font-weight:700;}
  .section-desc{font-size:12px;color:var(--text-faint);margin-top:2px;}

  table.dt{width:100%;border-collapse:collapse;font-size:13px;}
  table.dt th{text-align:right;font-size:11.5px;color:var(--text-faint);font-weight:600;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--surface-alt);white-space:nowrap;}
  table.dt td{padding:13px 14px;border-bottom:1px solid var(--border-soft);vertical-align:middle;}
  table.dt tr:last-child td{border-bottom:none;}
  table.dt tr:hover td{background:var(--surface-alt);}
  .dt-num{font-variant-numeric:tabular-nums;white-space:nowrap;}

  /* STAT CARDS */
  .stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px;}
  @media(max-width:1100px){.stats-grid{grid-template-columns:repeat(2,1fr);}}
  .stat-card{padding:16px 18px;display:flex;flex-direction:column;gap:6px;}
  .stat-top{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .stat-label{font-size:12px;color:var(--text-faint);font-weight:600;}
  .stat-ico{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:var(--primary-light);color:var(--primary-dark);}
  .stat-ico svg{width:16px;height:16px;}
  .stat-ico.gold{background:var(--gold-light);color:var(--gold);}
  .stat-ico.info{background:var(--info-light);color:var(--info);}
  .stat-ico.danger{background:var(--danger-light);color:var(--danger);}
  .stat-val{font-size:20px;font-weight:800;letter-spacing:-.2px;font-variant-numeric:tabular-nums;}
  .stat-val small{font-size:11px;font-weight:600;color:var(--text-faint);margin-right:3px;}
  .stat-sub{font-size:11.5px;color:var(--text-faint);}

  /* WALLET */
  .wallet-hero{border-radius:var(--radius);padding:22px;color:#fff;position:relative;overflow:hidden;background:linear-gradient(140deg,#1F5C4C,#153F34);margin-bottom:20px;}
  .wallet-hero::after{content:'';position:absolute;left:-40px;bottom:-60px;width:220px;height:220px;background:rgba(255,255,255,.07);border-radius:50%;}
  .wallet-hero::before{content:'';position:absolute;left:90px;top:-70px;width:150px;height:150px;background:rgba(255,255,255,.05);border-radius:50%;}
  .wallet-hero .w-top{display:flex;align-items:center;gap:10px;font-size:12.5px;font-weight:600;opacity:.92;position:relative;z-index:1;}
  .wallet-hero .w-top svg{width:17px;height:17px;}
  .wallet-hero .w-amount{font-size:30px;font-weight:800;margin:10px 0 4px;font-variant-numeric:tabular-nums;position:relative;z-index:1;}
  .wallet-hero .w-amount small{font-size:13px;font-weight:600;opacity:.85;margin-right:6px;}
  .wallet-hero .w-sub{font-size:12px;opacity:.85;position:relative;z-index:1;}
  .wallet-actions{display:flex;gap:10px;margin-top:18px;position:relative;z-index:1;flex-wrap:wrap;}
  .wallet-actions .btn{padding:9px 18px;}
  .wallet-hero .btn-ghost{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.25);color:#fff;}
  .wallet-hero .btn-ghost:hover{background:rgba(255,255,255,.22);}

  .wallet-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  @media(max-width:900px){.wallet-tiles{grid-template-columns:1fr;}}
  .w-tile{padding:16px 18px;display:flex;flex-direction:column;gap:8px;}
  .w-tile .wt-top{display:flex;align-items:center;gap:9px;}
  .w-tile .wt-ico{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .w-tile .wt-ico svg{width:17px;height:17px;}
  .w-tile .wt-name{font-size:13px;font-weight:700;}
  .w-tile .wt-desc{font-size:11.5px;color:var(--text-faint);line-height:1.8;}
  .w-tile .btn{margin-top:4px;}

  .notice{display:flex;gap:10px;align-items:flex-start;border-radius:var(--radius-sm);padding:12px 14px;font-size:12.5px;line-height:1.8;border:1px solid;}
  .notice svg{width:16px;height:16px;flex-shrink:0;margin-top:3px;}
  .notice.info{background:var(--info-light);border-color:#C6DCEC;color:#1E4460;}
  .notice.warn{background:var(--warning-light);border-color:#EEDCAB;color:#7C5512;}
  .notice.ok{background:var(--up-light);border-color:#C6E4D4;color:#155F3B;}

  .progress-track{height:6px;background:var(--border-soft);border-radius:20px;overflow:hidden;margin:10px 0 12px;}
  .progress-fill{height:100%;border-radius:20px;background:linear-gradient(90deg,var(--primary),#3A8067);}

  /* CHIPS (amount selector) */
  .chips{display:flex;gap:8px;flex-wrap:wrap;}
  .chip{border:1px solid var(--border);background:var(--surface);border-radius:20px;padding:7px 15px;font-size:12.5px;font-weight:700;color:var(--text-muted);cursor:pointer;transition:all .12s;}
  .chip:hover{border-color:var(--primary);color:var(--primary-dark);}
  .chip.active{background:var(--primary);border-color:var(--primary);color:#fff;}

  /* MY BRICKS */
  .bricks-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px;}
  .b-card{overflow:hidden;transition:box-shadow .15s,transform .15s;display:flex;flex-direction:column;}
  .b-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);}
  .b-head{display:flex;gap:14px;padding:16px 16px 14px;align-items:flex-start;}
  .b-thumb{width:56px;height:56px;border-radius:13px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.3);}
  .b-thumb svg{width:26px;height:26px;}
  .b-head-info{flex:1;min-width:0;}
  .b-title{font-size:14.5px;font-weight:800;line-height:1.5;}
  .b-city{font-size:11.5px;color:var(--text-faint);display:flex;align-items:center;gap:5px;margin-top:2px;}
  .b-city svg{width:12px;height:12px;}
  .b-chip-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
  .b-mini{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--surface-alt);color:var(--text-muted);border:1px solid var(--border-soft);}
  .b-mini.hl{background:var(--primary-light);color:var(--primary-dark);border-color:transparent;}
  .b-stats{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface-alt);border-top:1px solid var(--border-soft);border-bottom:1px solid var(--border-soft);}
  .b-col{padding:11px 6px;text-align:center;position:relative;}
  .b-col + .b-col::before{content:'';position:absolute;right:0;top:12px;bottom:12px;width:1px;background:var(--border);}
  .b-label{font-size:10px;color:var(--text-faint);display:block;margin-bottom:4px;white-space:nowrap;}
  .b-val{font-size:12.5px;font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums;}
  .b-val small{font-size:9px;font-weight:600;color:var(--text-faint);margin-right:2px;}
  .b-val.hl{color:var(--primary-dark);}
  .b-foot{padding:12px 16px;display:flex;gap:8px;margin-top:auto;}
  .b-foot .btn{flex:1;justify-content:center;padding:8px 10px;font-size:12px;}

  /* BUY */
  .buy-layout{display:grid;grid-template-columns:1.5fr 1fr;gap:18px;align-items:start;}
  @media(max-width:1000px){.buy-layout{grid-template-columns:1fr;}}
  .proj-select{display:flex;gap:14px;padding:16px;align-items:flex-start;border-bottom:1px solid var(--border-soft);}
  .proj-select .ps-info{flex:1;min-width:0;}
  .proj-select .ps-name{font-size:15px;font-weight:800;}
  .proj-select .ps-meta{font-size:11.5px;color:var(--text-faint);margin-top:2px;}
  .price-rows{padding:6px 16px 16px;display:grid;gap:10px;}
  .price-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 14px;border:1px solid var(--border-soft);border-radius:11px;background:var(--surface-alt);}
  .price-row .pr-label{font-size:12px;color:var(--text-muted);font-weight:600;}
  .price-row .pr-val{font-size:13.5px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .price-row .pr-val small{font-size:10px;font-weight:600;color:var(--text-faint);margin-right:3px;}
  .price-row.diff-up{border-color:#C6E4D4;background:var(--up-light);}
  .price-row.diff-down{border-color:#F0CFC9;background:var(--danger-light);}
  .qty-row{display:flex;align-items:center;gap:0;border:1px solid var(--border);border-radius:11px;overflow:hidden;background:var(--surface);width:fit-content;}
  .qty-row button{width:38px;height:42px;border:none;background:var(--surface-alt);color:var(--text);font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;}
  .qty-row button:hover{background:var(--border-soft);}
  .qty-row input{width:78px;height:42px;border:none;text-align:center;font-size:15px;font-weight:800;outline:none;font-variant-numeric:tabular-nums;}
  .total-box{background:var(--primary-light);border:1px solid #C9E0D7;border-radius:12px;padding:14px 16px;}
  .total-box .tt-row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--primary-dark);margin-bottom:6px;}
  .total-box .tt-row b{font-weight:800;font-variant-numeric:tabular-nums;}
  .total-box .tt-final{display:flex;justify-content:space-between;align-items:baseline;border-top:1px dashed #A9CDBD;padding-top:10px;margin-top:8px;}
  .total-box .tt-final .lbl{font-size:12.5px;font-weight:700;color:var(--primary-dark);}
  .total-box .tt-final .val{font-size:20px;font-weight:800;color:var(--primary-dark);font-variant-numeric:tabular-nums;}

  /* SECONDARY MARKET */
  .offers-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;}
  .o-card{padding:16px;display:flex;flex-direction:column;gap:10px;}
  .o-top{display:flex;align-items:center;gap:10px;}
  .o-thumb{width:42px;height:42px;border-radius:11px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.35);}
  .o-thumb svg{width:20px;height:20px;}
  .o-name{font-size:13.5px;font-weight:800;}
  .o-meta{font-size:11px;color:var(--text-faint);}
  .o-price{display:flex;align-items:baseline;gap:6px;}
  .o-price .p{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;}
  .o-price .u{font-size:11px;color:var(--text-faint);}
  .o-rows{display:grid;gap:6px;font-size:12px;}
  .o-rows .r{display:flex;justify-content:space-between;color:var(--text-muted);}
  .o-rows .r b{color:var(--text);font-weight:700;}

  /* FLOATING FIELDS + SELECT (shared) */
  .ffield{position:relative;display:flex;align-items:center;justify-content:center;gap:6px;min-height:52px;padding:10px 12px 6px;border:1.5px solid var(--border);border-radius:12px;background:var(--surface);transition:border-color .12s,box-shadow .12s;}
  .ffield>label{position:absolute;top:-10px;right:12px;padding:0 6px;background:var(--surface);font-size:11.5px;font-weight:600;color:var(--text-muted);line-height:1.6;}
  .ffield:focus-within{border-color:var(--acc,var(--primary));box-shadow:0 0 0 3px var(--acc-soft,var(--primary-light));}
  .ffield input{flex:1;min-width:0;border:none;outline:none;background:transparent;text-align:center;font-size:16px;font-weight:800;color:var(--text);font-variant-numeric:tabular-nums;}
  .ffield input:focus-visible{box-shadow:none;}
  .ffield.err{border-color:var(--danger);}
  .ffield.err:focus-within{border-color:var(--danger);box-shadow:0 0 0 3px var(--danger-light);}
  .ffield .ff-suffix{position:absolute;left:14px;font-size:12px;color:var(--text-faint);}
  .ffield.sel{justify-content:flex-start;padding:0 14px;min-height:50px;}
  .ffield.sel select{appearance:none;-webkit-appearance:none;width:100%;min-height:48px;border:none;outline:none;background:transparent;color:var(--text);font-size:13.5px;font-weight:700;padding:0 2px 0 28px;cursor:pointer;text-align:right;}
  .ffield.sel select:focus-visible{box-shadow:none;}
  .ff-chev{position:absolute;left:12px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--text-muted);display:flex;}
  .ff-chev svg{width:16px;height:16px;}
  .ff-hint{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--text-faint);padding:6px 4px 0;line-height:1.7;}
  .ff-hint b{color:var(--text-muted);font-weight:700;font-variant-numeric:tabular-nums;}
  .ff-hint.err,.ff-hint.err b{color:var(--danger);}
  .btn-gold:disabled{background:#D9C9A8;cursor:not-allowed;}
  .proj-controls{display:flex;gap:10px;padding:18px 16px 16px;align-items:stretch;flex-wrap:wrap;border-bottom:1px solid var(--border-soft);}
  .proj-controls .ffield{flex:1 1 200px;min-width:0;}
  .proj-controls .btn{padding:0 18px;min-height:50px;justify-content:center;}

  /* SECONDARY MARKET (structured flow: metrics → offers → request → notes) */
  .mk2{max-width:920px;margin:0 auto;}
  .mk2-head{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap;}
  .mk2-back{width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text-muted);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .mk2-back:hover{background:var(--surface-alt);color:var(--text);}
  .mk2-back svg{width:18px;height:18px;}
  .mk2-title{margin:0;font-size:17px;font-weight:800;}
  .mk2-proj{margin-right:auto;width:240px;}
  .mk2-sec{display:inline-flex;align-items:center;padding:7px 16px;margin:28px 0 12px;background:var(--surface);border:1px solid var(--border);border-right:4px solid var(--primary);border-radius:8px;font-size:13.5px;font-weight:800;}

  .mk2-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  .mk-m{border-radius:14px;padding:20px 14px 18px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;}
  .mk-m .mv{font-size:30px;font-weight:800;line-height:1.3;font-variant-numeric:tabular-nums;}
  .mk-m .mu{font-size:11.5px;font-weight:600;opacity:.88;}
  .mk-m .ml{font-size:14px;font-weight:800;margin-top:8px;}
  .mk-m .mn{display:flex;align-items:center;gap:6px;margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.3);font-size:11.5px;font-weight:600;line-height:1.7;}
  .mk-m .mn svg{width:14px;height:14px;}
  .mk-m.m1{background:var(--primary);color:#fff;}
  .mk-m.m2{background:#8F6520;color:#fff;}
  .mk-m.m3{background:var(--surface);color:var(--primary-dark);border:1.5px solid var(--primary);}

  .mk2-card{padding:0;overflow:hidden;}
  .mk2-tabs{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--border);}
  .mk2-tab{text-align:center;padding:14px 8px 0;cursor:pointer;font-size:14px;font-weight:700;color:var(--text-faint);}
  .mk2-tab span{display:inline-flex;align-items:center;gap:7px;padding:0 12px 12px;border-bottom:3px solid transparent;margin-bottom:-1px;}
  .mk2-tab:hover{color:var(--text);}
  .mk2-tab.active{color:var(--primary-dark);}
  .mk2-tab.active span{border-bottom-color:var(--primary);}
  .mk2-tab em{font-style:normal;font-size:11px;background:var(--surface-alt);color:var(--text-faint);padding:1px 8px;border-radius:20px;}
  .mk2-tab.active em{background:var(--primary-light);color:var(--primary-dark);}
  .mk2-help{padding:12px 18px 0;font-size:12px;color:var(--text-faint);line-height:1.9;}
  .mk2-tablewrap{overflow:auto;max-height:340px;padding:6px 14px 14px;}
  table.mk2-table{width:100%;border-collapse:collapse;text-align:center;font-size:13px;}
  .mk2-table th{position:sticky;top:0;background:var(--surface);z-index:1;font-size:12px;font-weight:600;color:var(--text-muted);padding:12px 10px;white-space:nowrap;}
  .mk2-table td{padding:12px 10px;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .mk2-table tbody tr:nth-child(odd) td{background:var(--surface-alt);}
  .mk2-table tbody td:first-child{border-radius:0 9px 9px 0;}
  .mk2-table tbody td:last-child{border-radius:9px 0 0 9px;}
  .mk2-table td.pr{font-weight:800;}
  .mk2-empty{padding:34px 16px 30px;text-align:center;color:var(--text-faint);font-size:12.5px;}
  .mk2-empty svg{width:26px;height:26px;color:var(--border);margin-bottom:8px;}

  /* request card */
  .req2{padding:22px 20px 24px;border:1.5px solid var(--acc);}
  .req2.buy{--acc:var(--primary);--acc-soft:var(--primary-light);--acc-dark:var(--primary-dark);}
  .req2.sell{--acc:var(--gold);--acc-soft:var(--gold-light);--acc-dark:#7C581D;}
  .req2-title{font-size:15px;font-weight:800;color:var(--text-muted);margin-bottom:22px;}
  .req2-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;}
  .req2-grid>div{min-width:0;}
  .qty-mini{width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:var(--surface-alt);color:var(--text);font-weight:800;cursor:pointer;font-size:16px;line-height:1;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}
  .qty-mini:hover{background:var(--acc-soft,var(--primary-light));}
  .mk2-total{position:relative;margin-top:24px;padding:18px 14px 14px;border:1.5px solid var(--acc);background:var(--acc-soft);border-radius:12px;text-align:center;}
  .mk2-total>label{position:absolute;top:-10px;right:12px;padding:0 6px;background:var(--surface);font-size:11.5px;font-weight:600;color:var(--text-muted);line-height:1.6;}
  .mk2-total .tv{font-size:24px;font-weight:800;color:var(--acc-dark);font-variant-numeric:tabular-nums;}
  .mk2-total .tv small{font-size:12px;font-weight:600;color:var(--text-muted);margin-right:4px;}
  .req-note{display:flex;gap:8px;align-items:flex-start;font-size:11.5px;color:var(--text-faint);line-height:1.9;padding:8px 2px 0;}
  .req-note svg{width:14px;height:14px;flex-shrink:0;margin-top:4px;color:var(--acc,var(--primary));}
  .req-warn{display:flex;gap:8px;align-items:flex-start;font-size:12px;font-weight:600;color:var(--danger);line-height:1.9;padding:8px 2px 0;}
  .req-warn[hidden]{display:none;}
  .req-warn svg{width:14px;height:14px;flex-shrink:0;margin-top:4px;}
  .req2-submit{display:flex;width:100%;max-width:340px;margin:22px auto 0;justify-content:center;padding:12px 16px;font-size:14px;}

  /* price ruler */
  .rl-caption{margin-top:26px;font-size:12px;color:var(--text-muted);text-align:center;}
  .ruler2{display:flex;gap:10px;direction:ltr;margin-top:6px;}
  .rl-end{flex:0 0 auto;min-width:74px;margin-top:34px;align-self:flex-start;display:flex;flex-direction:column;align-items:center;gap:1px;text-align:center;direction:rtl;}
  .rl-end .rl-name{font-size:12px;font-weight:700;color:var(--text-muted);}
  .rl-end .rl-num{font-size:11px;font-weight:700;line-height:1.5;}
  .rl-end.floor .rl-num{color:var(--danger);}
  .rl-end.ceil .rl-num{color:var(--info);}
  .rl-track{position:relative;flex:1;min-width:0;height:108px;}
  .rl-line{position:absolute;left:0;right:0;top:53px;height:2px;background:#C9CED6;}
  .rl-line::before,.rl-line::after{content:'';position:absolute;top:-3.5px;width:9px;height:9px;border:solid #C9CED6;}
  .rl-line::before{left:-1px;border-width:0 0 2px 2px;transform:rotate(45deg);}
  .rl-line::after{right:-1px;border-width:2px 2px 0 0;transform:rotate(45deg);}
  .rl-tick{position:absolute;top:-4px;width:2px;height:10px;background:#B8BEC7;transform:translateX(-50%);}
  .rl-ref{position:absolute;top:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--info);font-size:11px;font-weight:700;white-space:nowrap;direction:rtl;pointer-events:none;}
  .rl-ref svg{width:12px;height:32px;}
  .rl-val{position:absolute;top:82px;transform:translateX(-50%);font-size:11.5px;font-weight:800;color:var(--acc-dark);white-space:nowrap;direction:rtl;pointer-events:none;}
  input[type=range].rl-range{position:absolute;left:-4px;top:31px;width:calc(100% + 8px);height:44px;margin:0;padding:0;background:transparent;-webkit-appearance:none;appearance:none;cursor:pointer;direction:ltr;}
  .rl-range::-webkit-slider-runnable-track{height:44px;background:transparent;}
  .rl-range::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:8px;height:44px;border-radius:5px;background:var(--acc);border:none;cursor:grab;box-shadow:0 0 0 3px #fff,0 2px 8px rgba(20,23,28,.28);}
  .rl-range:active::-webkit-slider-thumb{cursor:grabbing;}
  .rl-range::-moz-range-track{height:44px;background:transparent;}
  .rl-range::-moz-range-thumb{width:8px;height:44px;border:none;border-radius:5px;background:var(--acc);cursor:grab;box-shadow:0 0 0 3px #fff,0 2px 8px rgba(20,23,28,.28);}
  .rl-range:focus-visible{box-shadow:none;}
  .rl-range:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 3px #fff,0 0 0 6px var(--acc-soft);}

  .mk2-notes{margin:0;padding:0 22px 0 0;font-size:12.5px;color:var(--text-muted);line-height:2.1;}
  .mk2-notes li::marker{color:var(--primary);}
  .mk2-notes b{color:var(--text);}

  @media(max-width:700px){
    .mk2-metrics,.req2-grid{grid-template-columns:minmax(0,1fr);}
    .mk-m{padding:14px;}
    .mk-m .mv{font-size:24px;}
    .mk-m .ml{margin-top:4px;}
    .req2{padding:20px 14px 22px;}
    .mk2-proj{width:100%;margin-right:0;}
    .rl-end{min-width:58px;}
  }

  /* BUY — 3-step flow */
  .buy2{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:18px;align-items:start;}
  .buy2-side{position:sticky;top:84px;}
  @media(max-width:1000px){.buy2{grid-template-columns:minmax(0,1fr);}.buy2-side{position:static;}}
  .st-card{padding:20px;margin-bottom:16px;}
  .st-head{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
  .st-n{width:28px;height:28px;border-radius:50%;background:var(--primary);color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .st-t{font-size:15px;font-weight:800;line-height:1.5;}
  .st-s{font-size:11.5px;color:var(--text-faint);}
  .bp-ctl{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap;padding-top:6px;}
  .bp-ctl .ffield{flex:1 1 200px;min-width:0;}
  .bp-ctl .btn{padding:0 18px;min-height:50px;justify-content:center;}
  .bp-sum{display:flex;gap:14px;align-items:center;margin-top:20px;}
  .bp-name{font-size:15px;font-weight:800;}
  .bp-meta{font-size:12px;color:var(--text-faint);}
  .bp-prog{margin-top:16px;}
  .bp-prog .row{display:flex;justify-content:space-between;font-size:11.5px;color:var(--text-muted);}
  .bp-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px;}
  @media(max-width:560px){.bp-stats{grid-template-columns:1fr;}}
  .bp-stat{background:var(--surface-alt);border:1px solid var(--border-soft);border-radius:11px;padding:11px 10px;text-align:center;}
  .bp-stat .l{font-size:11px;color:var(--text-faint);display:block;}
  .bp-stat .v{font-size:14px;font-weight:800;font-variant-numeric:tabular-nums;display:block;margin-top:2px;}
  .bp-stat .v small{font-size:10px;font-weight:600;color:var(--text-faint);}
  .bp-stat.up{background:var(--up-light);border-color:#C6E4D4;} .bp-stat.up .v{color:var(--up);}
  .bp-stat.down{background:var(--danger-light);border-color:#F0CFC9;} .bp-stat.down .v{color:var(--danger);}
  .link-btn{background:none;border:none;color:var(--primary-dark);font-weight:700;font-size:12.5px;padding:0;margin-top:14px;display:inline-flex;gap:4px;align-items:center;}
  .link-btn svg{width:14px;height:14px;}
  .bp-more{margin-top:10px;border-top:1px dashed var(--border);padding-top:4px;}
  .sum-row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;font-size:13px;color:var(--text-muted);border-bottom:1px solid var(--border-soft);}
  .sum-row b{color:var(--text);font-variant-numeric:tabular-nums;text-align:left;}
  .sum-row b.neg{color:var(--danger);}
  .sum-total{margin:16px 0 4px;padding:14px;border-radius:12px;background:var(--primary-light);border:1px solid #C9E0D7;text-align:center;}
  .sum-total .l{font-size:12px;color:var(--primary-dark);font-weight:700;}
  .sum-total .v{font-size:24px;font-weight:800;color:var(--primary-dark);font-variant-numeric:tabular-nums;}
  .sum-total .v small{font-size:12px;font-weight:600;color:var(--text-muted);}
  /* my bricks: clickable qty chip + detail modal */
  .b-link{cursor:pointer;display:inline-flex;align-items:center;gap:4px;border:none;font-family:inherit;}
  .b-link svg{width:11px;height:11px;}
  .b-link:hover{background:#D3E6DE;}
  .modal.wide{max-width:900px;}
  .bd-tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px;}
  @media(max-width:640px){.bd-tiles{grid-template-columns:1fr 1fr;}}
  .bd-tile{border:1px solid var(--border-soft);background:var(--surface-alt);border-radius:11px;padding:11px 8px;text-align:center;}
  .bd-tile .l{font-size:11px;color:var(--text-faint);display:block;}
  .bd-tile .v{font-size:14px;font-weight:800;font-variant-numeric:tabular-nums;display:block;margin-top:2px;}
  .bd-pl{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:14px 16px;border-radius:12px;margin-bottom:18px;font-weight:800;}
  .bd-pl.up{background:var(--up-light);color:var(--up);} .bd-pl.down{background:var(--danger-light);color:var(--danger);}
  .bd-pl .big{font-size:20px;font-variant-numeric:tabular-nums;}
  .bd-pl .sm{font-size:12px;font-weight:600;opacity:.85;}
  .pl-cell{font-weight:800;white-space:nowrap;} .pl-cell.up{color:var(--up);} .pl-cell.down{color:var(--danger);}
  .pl-cell small{display:block;font-size:10.5px;font-weight:700;}
  table.dt tfoot td{font-weight:800;background:var(--surface-alt);border-top:1px solid var(--border);}

  /* ACCOUNT */
  .acct-tabs{display:flex;flex-direction:column;gap:2px;width:190px;flex-shrink:0;}
  .acct-tab{padding:11px 14px;border-radius:10px;font-size:13px;font-weight:600;color:var(--text-muted);cursor:pointer;}
  .acct-tab:hover{background:var(--surface-alt);}
  .acct-tab.active{background:var(--primary-light);color:var(--primary-dark);}
  .acct-layout{display:flex;gap:24px;align-items:flex-start;}
  .kv-row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border-soft);font-size:13px;gap:12px;}
  .kv-row .k{color:var(--text-faint);}
  .kv-row .v{font-weight:600;text-align:left;}

  .identity-grid{display:grid;grid-template-columns:1fr;gap:18px;}
  .id-card{padding:18px;position:relative;overflow:hidden;}
  .id-card-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .id-card-icon{width:38px;height:38px;border-radius:10px;background:var(--primary-light);color:var(--primary-dark);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .id-card-icon svg{width:19px;height:19px;}
  .id-card-titles{min-width:0;}
  .id-card-title{font-weight:800;font-size:13.5px;}
  .id-card-sub{font-size:11.5px;color:var(--text-faint);margin-top:1px;}
  .id-card-head .badge{margin-right:auto;flex-shrink:0;}
  .id-card-body{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  @media(max-width:560px){.id-card-body{grid-template-columns:1fr;}}
  .doc-card{border:1px solid var(--border);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;}
  .doc-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
  .doc-icon{width:34px;height:34px;border-radius:9px;background:var(--info-light);color:var(--info);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .doc-icon svg{width:16px;height:16px;}
  .doc-name{font-weight:700;font-size:13px;}
  .doc-meta{font-size:11.5px;color:var(--text-faint);}

  .bank-cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;}
  .bank-card{border-radius:16px;padding:18px 20px;color:#fff;min-height:120px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;}
  .bank-card::after{content:'';position:absolute;left:-30px;bottom:-30px;width:130px;height:130px;background:rgba(255,255,255,.08);border-radius:50%;}
  .bank-card .bc-top{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;position:relative;z-index:1;}
  .bank-card .bc-top svg{width:20px;height:20px;opacity:.9;}
  .bank-card .bc-number{font-size:16px;letter-spacing:1px;font-weight:700;margin:16px 0 8px;direction:ltr;text-align:right;position:relative;z-index:1;}
  .bank-card .bc-bottom{display:flex;justify-content:space-between;align-items:flex-end;font-size:11px;opacity:.92;position:relative;z-index:1;}
  .bank-card .bc-del{position:absolute;top:10px;left:10px;width:26px;height:26px;border-radius:8px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer;z-index:2;opacity:0;transition:opacity .12s;}
  .bank-card:hover .bc-del{opacity:1;}
  .bank-card .bc-del svg{width:13px;height:13px;}

  /* FORM */
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .field{display:flex;flex-direction:column;gap:6px;}
  .field.full{grid-column:1/-1;}
  .field label{font-size:12.5px;font-weight:600;color:var(--text-muted);}
  .field input,.field select,.field textarea{border:1px solid var(--border);border-radius:9px;padding:10px 12px;background:var(--surface);color:var(--text);outline:none;transition:border-color .12s;}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);}
  .field .hint{font-size:11px;color:var(--text-faint);}
  .upload-box{border:1.5px dashed var(--border);border-radius:12px;padding:22px;text-align:center;color:var(--text-faint);font-size:12.5px;background:var(--surface-alt);cursor:pointer;}
  .upload-box svg{width:22px;height:22px;margin-bottom:8px;color:var(--text-faint);}

  /* MODAL */
  .overlay{position:fixed;inset:0;background:rgba(15,17,21,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
  .modal{background:var(--surface);border-radius:18px;width:100%;max-width:760px;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 30px 60px -20px rgba(0,0,0,.35);}
  .modal.narrow{max-width:520px;}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--border);flex-shrink:0;}
  .modal-title{font-size:15px;font-weight:700;}
  .modal-close{width:30px;height:30px;border-radius:9px;border:1px solid var(--border);background:var(--surface-alt);display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .modal-close svg{width:14px;height:14px;}
  .modal-body{padding:22px;overflow-y:auto;}
  .modal-foot{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;border-top:1px solid var(--border);flex-shrink:0;gap:10px;}

  .empty{text-align:center;padding:50px 20px;color:var(--text-faint);}
  .empty svg{width:34px;height:34px;margin-bottom:10px;color:var(--border);}
  .empty .t{font-size:13.5px;font-weight:700;color:var(--text-muted);margin-bottom:3px;}
  .empty .btn{margin-top:14px;}

  .notif-item{display:flex;gap:12px;padding:16px 18px;border-bottom:1px solid var(--border-soft);cursor:pointer;}
  .notif-item:last-child{border-bottom:none;}
  .notif-item.unread{background:var(--surface-alt);}
  .notif-item:hover{background:#F1F3F5;}
  .notif-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .notif-icon svg{width:16px;height:16px;}
  .notif-title{font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px;}
  .notif-title .unread-dot{width:7px;height:7px;border-radius:50%;background:var(--danger);}
  .notif-desc{font-size:12px;color:var(--text-faint);margin-top:2px;}
  .notif-time{font-size:11px;color:var(--text-faint);white-space:nowrap;}

  /* TOAST */
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#1A1E24;color:#fff;padding:12px 20px;border-radius:12px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:10px;box-shadow:0 12px 32px -8px rgba(0,0,0,.4);z-index:200;opacity:0;transition:all .25s;max-width:420px;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast svg{width:16px;height:16px;flex-shrink:0;}
  .toast.toast-success svg{color:#6BD5A7;}
  .toast.toast-error{background:#5A1A14;}
  .toast.toast-error svg{color:#FFB8AC;}
  .toast.toast-info{background:#153A56;}
  .toast.toast-info svg{color:#9BCBF0;}

  /* CONFIRM */

/* ============== TOAST & CONFIRM ============== */
function showToast(msg, type='success'){
  const el = document.createElement('div');
  el.className = 'toast toast-'+type;
  const icon = type==='error' ? I.warn : type==='info' ? I.info : I.check;
  el.innerHTML = icon + '<span>'+msg+'</span>';
  document.body.appendChild(el);
  requestAnimationFrame(()=> el.classList.add('show'));
  setTimeout(()=>{
    el.classList.remove('show');
    setTimeout(()=> el.remove(), 280);
  }, 2800);
}
function showConfirm({title, msg, confirmLabel='حذف', onConfirm}){
  state.confirm = {title, msg, confirmLabel, onConfirm};
  render();
}
function closeConfirm(){ state.confirm=null; render(); }
function unreadCount(){ return NOTIFS.filter(n=> n.unread && !state.notifRead.has(n.id)).length; }

/* ============== DERIVED ============== */
function myBrickRow(pid){
  return MY_BRICKS.find(b=>b.projectId===pid);
}
function portfolioValue(){
  return MY_BRICKS.reduce((s,b)=>{
    const p = findProject(b.projectId);
    return s + (p ? p.tokenPrice*b.qty : 0);
  },0);
}
function totalSpent(){
  return MY_BRICKS.reduce((s,b)=>{
    return s + b.avgBuyPrice*b.qty;
  },0);
}
function pnl(){
  const v = portfolioValue(), s = totalSpent();
  return {value:v-s, pct: s? Math.round((v-s)/s*100):0};
}

/* ============== SECONDARY MARKET ============== */
function marketPriceRange(p){
  return { floor: Math.round(p.tokenPrice*0.8), ceil: Math.round(p.tokenPrice*1.2) };
}
function millions(n){ return toFa((Math.round(n/10000)/100).toString().replace('.','٫')); }
function sellableQty(pid){
  const mine = myBrickRow(pid);
  const have = mine ? mine.qty : 0;
  const onSale = MY_REQUESTS.filter(r=>r.projectId===pid && r.kind==='sell').reduce((s,r)=>s+r.qty,0);
  return Math.max(0, have-onSale);
}
function mkCalc(p){
  const range = marketPriceRange(p);
  const tab = state.marketTab;
  const qty = state.sellQty||0;
  const price = state.sellPrice||0;
  const total = qty*price;
  const commission = Math.round(total*0.01);
  const final = tab==='sell' ? total-commission : total+commission;
  const priceOk = price>=range.floor && price<=range.ceil;
  let warn = '';
  if(qty>0){
    if(tab==='sell'){
      const av = sellableQty(p.id);
      if(qty>av) warn = av>0 ? `حداکثر ${toFa(av)} خشت از این پروژه قابل فروش دارید.` : 'در این پروژه خشت قابل فروشی ندارید.';
    } else if(final>state.walletBalance){
      warn = 'موجودی کیف پول شما برای این خرید کافی نیست.';
    }
  }
  return {
    range, tab, qty, price, total, commission, final, priceOk, warn,
    pct: Math.max(0, Math.min(100, (price-range.floor)/(range.ceil-range.floor)*100)),
    eq: p.tokenArea ? Math.round(price/p.tokenArea) : 0,
  };
}
function mkFeeText(c){
  return c.tab==='sell'
    ? `کارمزد ۱٪ (${fmt(c.commission)} تومان) از مبلغ کل کسر شده است.`
    : `کارمزد ۱٪ (${fmt(c.commission)} تومان) به مبلغ کل اضافه شده است.`;
}
function mkPriceHint(c){
  return c.priceOk
    ? `<span>قیمت معادل مترمربع هر خشت</span><b>${fmt(c.eq)} تومان</b>`
    : `<span>قیمت باید بین ${fmt(c.range.floor)} و ${fmt(c.range.ceil)} تومان باشد.</span>`;
}

      ${list.length===0
        ? `<div class="mk2-empty">${I.info}<div>${isSell?'در حال حاضر پیشنهاد فروشی برای این پروژه ثبت نشده است.':'در حال حاضر پیشنهاد خریدی برای این پروژه ثبت نشده است.'}</div></div>`
        : `<div class="mk2-tablewrap"><table class="mk2-table">

      <div class="mk2-total">

function emptyState(t,d){
  return `<div class="card empty">${I.info}<div class="t">${t}</div><div>${d}</div></div>`;
}

/* ============== MODALS ============== */
function renderModal(){
  const m = state.modal;
  const TITLES = {
    deposit:{t:'افزایش موجودی — پرداخت آنلاین', w:''},
    withdraw:{t:'برداشت وجه', w:'narrow'},
    gift:{t:'استفاده از کارت هدیه', w:'narrow'},
    receipt:{t:'ثبت فیش واریزی', w:''},
    addCard:{t:'افزودن حساب بانکی', w:'narrow'},
    editPersonal:{t:'ویرایش اطلاعات شخصی', w:''},
    brickDetail:{t:'جزئیات دارایی', w:'wide'},
    buyOffer:{t:'خرید از بازار ثانویه', w:'narrow'},
  };
  const conf = TITLES[m.type] || {t:'فرم', w:''};
  return `
  <div class="overlay" data-action="close-modal-bg">
    <div class="modal ${conf.w}" onclick="event.stopPropagation()">
      <div class="modal-head">
        <div class="modal-title">${conf.t}</div>
        <div class="modal-close" data-action="close-modal">${I.x}</div>
      </div>
      <div class="modal-body">${modalBody()}</div>
      ${m.type==='brickDetail'?'':`<div class="modal-foot">
        <button class="btn btn-ghost" data-action="close-modal">انصراف</button>
        <button class="btn btn-primary" data-action="modal-submit" data-modaltype="${m.type}">${I.check}${SUBMIT_LABEL[m.type]||'ثبت'}</button>
      </div>`}
    </div>
  </div>`;
}
const SUBMIT_LABEL = {
  deposit:'پرداخت و افزایش موجودی',
  withdraw:'ثبت درخواست برداشت',
  gift:'استفاده از کارت هدیه',
  receipt:'ثبت فیش واریزی',
  addCard:'افزودن کارت',
  editPersonal:'ذخیره تغییرات',
  buyOffer:'تایید و خرید',
};

function modalBody(){
  const m = state.modal;
  if(m.type==='deposit'){
    const amt = faNumToEn(state.depositAmount||'').replace(/[^0-9]/g,'');
    const n = Number(amt)||0;
    return `
    <div class="notice info" style="margin-bottom:16px;">${I.info}<div>حداقل مبلغ واریزی ۱۰,۰۰۰ تومان و حداکثر ۱۰۰,۰۰۰,۰۰۰ تومان (۱۰۰ میلیون تومان) در هر تراکنش است.</div></div>
    <div class="field full" style="margin-bottom:14px;">
      <label>موجودی فعلی</label>
      <input readonly value="${fmt(state.walletBalance)} تومان" style="background:var(--surface-alt);"/>
    </div>
    <div class="field full" style="margin-bottom:14px;">
      <label>مبلغ موردنظر برای واریز</label>
      <input data-field="deposit-amount" value="${state.depositAmount}" inputmode="numeric" placeholder="مبلغ را به تومان وارد کنید" style="direction:ltr;text-align:left;font-variant-numeric:tabular-nums;"/>
    </div>
    <div class="chips" style="margin-bottom:6px;">
      ${state.depositChips.map(c=>`<span class="chip ${n===c?'active':''}" data-action="dep-chip" data-n="${c}">${toFa(fmt(c))} تومان</span>`).join('')}
    </div>
    ${n>0?`<div class="total-box" style="margin-top:14px;">
      <div class="tt-final"><span class="lbl">مبلغ نهایی واریزی</span><span class="val">${fmt(n)} <small style="font-size:12px;">تومان</small></span></div>
    </div>`:''}`;
  }
  if(m.type==='withdraw'){
    return `
    <div class="field full" style="margin-bottom:14px;">
      <label>موجودی فعلی</label>
      <input readonly value="${fmt(state.walletBalance)} تومان" style="background:var(--surface-alt);"/>
    </div>
    <div class="field full" style="margin-bottom:14px;">
      <label>مبلغ برداشت (تومان)</label>
      <input data-field="withdraw-amount" inputmode="numeric" placeholder="مبلغ را به تومان وارد کنید" style="direction:ltr;text-align:left;font-variant-numeric:tabular-nums;"/>
    </div>
    <div class="field full">
      <label>حساب مقصد</label>
      ${state.cards.length
        ? `<select data-field="withdraw-card">${state.cards.map(c=>`<option value="${c.id}">${c.bank} — ${c.number}</option>`).join('')}</select>`
        : `<div class="notice warn">${I.warn}<div>هنوز حساب بانکی ثبت نکرده‌اید. از تب «اطلاعات مالی» یک حساب اضافه کنید.</div></div>`}
    </div>
    <div class="notice info" style="margin-top:16px;">${I.clock}<div>درخواست‌های برداشت وجه پس از بررسی، حداکثر ظرف ۳ روز کاری به حساب شما واریز می‌شود. در صورت بروز هرگونه مشکل، تیم پشتیبانی با شما تماس خواهد گرفت.</div></div>`;
  }
  if(m.type==='gift'){
    return `
    <div class="field full" style="margin-bottom:14px;">
      <label>کد کارت هدیه</label>
      <input data-field="gift-code" placeholder="کد ۱۲ رقمی کارت هدیه" style="direction:ltr;text-align:left;letter-spacing:1px;"/>
    </div>
    <div class="notice ok">${I.gift}<div>پس از وارد کردن کد، مبلغ کارت هدیه به‌صورت آنی به موجودی کیف پول شما اضافه می‌شود.</div></div>`;
  }
  if(m.type==='receipt'){
    return `
    <div class="form-grid">
      <div class="field"><label>مبلغ واریزی (تومان)</label><input data-field="rc-amount" inputmode="numeric" placeholder="مبلغ به تومان" style="direction:ltr;text-align:left;"/></div>
      <div class="field"><label>تاریخ واریز</label><input data-field="rc-date" placeholder="مثلاً: ۱۴۰۳/۰۶/۲۴"/></div>
      <div class="field full"><label>شماره پیگیری</label><input data-field="rc-trace" placeholder="شماره پیگیری فیش واریزی" style="direction:ltr;text-align:left;"/></div>
      <div class="field full"><label>تصویر فیش واریزی</label><div class="upload-box">${I.upload}<div>برای آپلود فیش کلیک کنید یا بکشید و رها کنید</div></div></div>
    </div>
    <div class="notice info" style="margin-top:14px;">${I.clock}<div>پس از ثبت، فیش شما توسط کارشناسان مالی بررسی می‌شود و موجودی کیف پولتان حداکثر ظرف ۲۴ ساعت افزایش می‌یابد.</div></div>`;
  }
  if(m.type==='addCard') return `
    <div class="form-grid">
      <div class="field full"><label>بانک</label><select data-field="bank">${BANKS.map(b=>`<option>${b}</option>`).join('')}</select></div>
      <div class="field full"><label>نام صاحب حساب</label><input data-field="holder" placeholder="مثلاً: ${ACCOUNT.personal.name}"/></div>
      <div class="field full"><label>شماره کارت</label><input data-field="number" placeholder="XXXX-XXXX-XXXX-XXXX" style="direction:ltr;text-align:right;"/></div>
      <div class="field full"><label>شماره شبا</label><input data-field="iban" placeholder="IRXXXXXXXXXXXXXXXXXXXXXX" style="direction:ltr;text-align:right;"/></div>
    </div>`;
  if(m.type==='editPersonal') return `
    <div class="form-grid">
      <div class="field"><label>نام و نام خانوادگی</label><input data-field="name" value="${ACCOUNT.personal.name}"/></div>
      <div class="field"><label>کد ملی</label><input data-field="nationalId" value="${ACCOUNT.personal.nationalId}" style="direction:ltr;text-align:left;"/></div>
      <div class="field"><label>شماره تماس</label><input data-field="phone" value="${ACCOUNT.personal.phone}" style="direction:ltr;text-align:left;"/></div>
      <div class="field"><label>ایمیل</label><input data-field="email" value="${ACCOUNT.personal.email}" style="direction:ltr;text-align:left;"/></div>
    </div>`;
  if(m.type==='brickDetail'){
    const b = MY_BRICKS.find(x=>x.id===m.id);
    if(!b) return '';
    const p = findProject(b.projectId), cur = p.tokenPrice;
    const cost = b.purchases.reduce((x,r)=>x+r.qty*r.price,0), value = cur*b.qty, diff = value-cost;
    const pct = cost? Math.round(diff/cost*1000)/10 : 0, up = diff>=0, sg = up?'+':'';
    const pl = (d,c)=>`<span class="pl-cell ${d>=0?'up':'down'}">${d>=0?'+':''}${fmt(d)}<small><bdi dir="ltr">${d>=0?'+':'−'}${toFa(String(Math.abs(c)).replace('.','٫'))}٪</bdi></small></span>`;
    return `
    <div style="display:flex;gap:14px;align-items:center;margin-bottom:16px;">
      <div class="b-thumb" style="background:${p.cover};width:52px;height:52px;">${I.building}</div>
      <div><div style="font-size:15px;font-weight:800;">${p.name}</div><div style="font-size:12px;color:var(--text-faint);">${p.city} · مرحله فعلی: ${p.currentStage}</div></div>
    </div>
    <div class="bd-tiles">
      <div class="bd-tile"><span class="l">تعداد خشت</span><span class="v">${toFa(b.qty)}</span></div>
      <div class="bd-tile"><span class="l">میانگین قیمت خرید</span><span class="v">${fmt(b.avgBuyPrice)}</span></div>
      <div class="bd-tile"><span class="l">قیمت فعلی هر خشت</span><span class="v">${fmt(cur)}</span></div>
      <div class="bd-tile"><span class="l">ارزش فعلی</span><span class="v">${fmt(value)}</span></div>
    </div>
    <div class="bd-pl ${up?'up':'down'}">
      <span>سود و زیان کل (نسبت به مبلغ خرید ${fmt(cost)} تومان)</span>
      <span class="big">${sg}${fmt(diff)} <span class="sm">تومان · <bdi dir="ltr">${up?'+':'−'}${toFa(String(Math.abs(pct)).replace('.','٫'))}٪</bdi></span></span>
    </div>
    <div style="font-weight:800;font-size:13.5px;margin-bottom:8px;">تاریخچه خریدها</div>
    <div style="overflow-x:auto;">
    <table class="dt">
      <thead><tr><th>تاریخ خرید</th><th>تعداد</th><th>قیمت خرید (تومان)</th><th>قیمت فعلی (تومان)</th><th>مبلغ پرداختی</th><th>سود / زیان (تومان)</th><th>مرحله در زمان خرید</th></tr></thead>
      <tbody>
        ${b.purchases.map(r=>`<tr>
          <td>${r.date}</td>
          <td class="dt-num">${toFa(r.qty)}</td>
          <td class="dt-num">${fmt(r.price)}</td>
          <td class="dt-num">${fmt(cur)}</td>
          <td class="dt-num">${fmt(r.price*r.qty)}</td>
          <td>${pl((cur-r.price)*r.qty, Math.round((cur-r.price)/r.price*1000)/10)}</td>
          <td><span class="badge badge-draft">${r.stage}</span></td>
        </tr>`).join('')}
      </tbody>
      <tfoot><tr><td>جمع</td><td class="dt-num">${toFa(b.qty)}</td><td class="dt-num">${fmt(b.avgBuyPrice)}</td><td class="dt-num">${fmt(cur)}</td><td class="dt-num">${fmt(cost)}</td><td>${pl(diff,pct)}</td><td></td></tr></tfoot>
    </table>
    </div>
    <div style="margin-top:16px;display:flex;justify-content:flex-end;"><button class="btn btn-primary" data-action="buy-more" data-pid="${p.id}">${I.plus}خرید خشت بیشتر از این پروژه</button></div>`;
  }
  if(m.type==='buyOffer'){
    const o = OFFERS.find(x=>x.id===m.id);
    if(!o) return '';
    const p = findProject(o.projectId);
    return `
    <div style="display:flex;gap:12px;align-items:center;margin-bottom:16px;">
      <div class="o-thumb" style="background:${p.cover};">${I.building}</div>
      <div><div style="font-weight:800;">${p.name}</div><div style="font-size:11.5px;color:var(--text-faint);">${o.seller}</div></div>
    </div>
    <div class="price-rows" style="padding:0;">
      <div class="price-row"><span class="pr-label">تعداد خشت</span><span class="pr-val">${toFa(o.qty)} عدد</span></div>
      <div class="price-row"><span class="pr-label">قیمت هر خشت</span><span class="pr-val">${fmt(o.price)} <small>تومان</small></span></div>
      <div class="price-row"><span class="pr-label">موجودی کیف پول شما</span><span class="pr-val">${fmt(state.walletBalance)} <small>تومان</small></span></div>
      <div class="price-row"><span class="pr-label">کارمزد بازار (۱٪)</span><span class="pr-val">${fmt(Math.round(o.price*o.qty*0.01))} <small>تومان</small></span></div>
      <div class="total-box" style="margin-top:12px;">
        <div class="tt-final"><span class="lbl">مبلغ کل پرداختی</span><span class="val">${fmt(o.price*o.qty + Math.round(o.price*o.qty*0.01))} <small style="font-size:12px;">تومان</small></span></div>
      </div>
    </div>
    ${o.price*o.qty > state.walletBalance ? `<div class="notice warn" style="margin-top:14px;">${I.warn}<div>موجودی کیف پول شما برای این خرید کافی نیست. ابتدا موجودی خود را افزایش دهید.</div></div>`:''}`;
  }
  return '';
}

function renderConfirm(){
  const c = state.confirm;
  return `
  <div class="overlay" data-action="confirm-cancel">
    <div class="confirm-modal" onclick="event.stopPropagation()">
      <div class="confirm-icon">${I.warn}</div>
      <div class="confirm-title">${c.title}</div>
      <div class="confirm-msg">${c.msg}</div>
      <div class="confirm-actions">
        <button class="btn btn-ghost" data-action="confirm-cancel">انصراف</button>
        <button class="btn btn-danger-soft" data-action="confirm-yes">${c.confirmLabel}</button>
      </div>
    </div>
  </div>`;
}

/* ============== EVENTS ============== */
function bindEvents(){
  document.querySelectorAll('[data-onchange]').forEach(el=>{
    el.addEventListener('change', (e)=>{
      const action = el.dataset.onchange;
      if(action==='buy-project'){ state.buyProject = el.value; state.buyQty = Math.max(2, state.buyQty); render(); }
      else if(action==='market-project'){ state.marketProject = el.value; state.sellPrice = 0; state.sellQty = 1; render(); }
    });
  });

  document.querySelectorAll('[data-field="sell-price"]').forEach(el=>{
    el.addEventListener('input', ()=>{
      state.sellPrice = Number(el.value);
      syncMarketUI();
    });
  });

  document.querySelectorAll('[data-field="sell-qty"]').forEach(el=>{
    el.addEventListener('input', ()=>{
      const raw = faNumToEn(el.value).replace(/[^0-9]/g,'');
      state.sellQty = raw? Math.min(9999, Number(raw)) : 0;
      syncMarketUI();
    });
  });

  document.querySelectorAll('[data-field="mk-price"]').forEach(el=>{
    el.addEventListener('input', ()=>{
      const raw = faNumToEn(el.value).replace(/[^0-9]/g,'');
      state.sellPrice = raw ? Math.min(999999999999, Number(raw)) : 0;
      el.value = raw ? fmt(state.sellPrice) : '';
      syncMarketUI();
    });
    el.addEventListener('blur', ()=>{
      const p = findProject(state.marketProject) || PROJECTS[0];
      const r = marketPriceRange(p);
      if(!state.sellPrice) state.sellPrice = p.tokenPrice;
      state.sellPrice = Math.min(r.ceil, Math.max(r.floor, state.sellPrice));
      el.value = fmt(state.sellPrice);
      syncMarketUI();
    });
  });

  document.querySelectorAll('[data-field="buy-qty"]').forEach(el=>{
    el.addEventListener('input', ()=>{
      const raw = faNumToEn(el.value).replace(/[^0-9]/g,'');
      state.buyQty = raw? Math.min(9999, Number(raw)) : 0;
      syncBuyUI();
    });
  });

  document.querySelectorAll('[data-field="deposit-amount"]').forEach(el=>{
    el.addEventListener('input', ()=>{
      const raw = faNumToEn(el.value).replace(/[^0-9]/g,'');
      state.depositAmount = raw? fmt(Number(raw)) : '';
      el.value = state.depositAmount;
      if(!document.querySelector('.modal .total-box')){
        render();
        const f = document.querySelector('[data-field="deposit-amount"]');
        if(f){ f.focus(); f.setSelectionRange(f.value.length, f.value.length); }
        return;
      }
      syncDepositUI();
    });
  });

  document.querySelectorAll('[data-action]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      e.stopPropagation();
      const a = el.dataset.action;

      if(a==='nav'){ if(el.dataset.view==='market' && state.view!=='market') state.marketBack = state.view; state.view = el.dataset.view; state.mobileMenu=false; }
      else if(a==='toggle-menu'){ state.mobileMenu = !state.mobileMenu; }

      else if(a==='ordertab'){ state.orderTab = el.dataset.tab; }
      else if(a==='acctab'){ state.acctTab = el.dataset.tab; }

      else if(a==='markettab'){ state.marketTab = el.dataset.tab; render(); }
      else if(a==='toggle-buy-info'){ state.buyInfo = !state.buyInfo; }
      else if(a==='buy-more'){ state.buyProject = el.dataset.pid; state.buyQty = Math.max(state.buyQty||0, findProject(el.dataset.pid).minBuy); state.modal={type:null}; state.view='buy'; }
      else if(a==='market-back'){ state.view = state.marketBack || 'buy'; state.marketBack = null; }
      else if(a==='sell-brick'){ state.marketProject = el.dataset.pid; state.marketTab = 'sell'; state.sellPrice = 0; state.sellQty = 1; state.marketBack = state.view; state.view = 'market'; }
      else if(a==='sell-inc'){ state.sellQty = Math.min(9999, (state.sellQty||0)+1); syncMarketUI(); return; }
      else if(a==='sell-dec'){ state.sellQty = Math.max(0, (state.sellQty||0)-1); syncMarketUI(); return; }
      else if(a==='cancel-request'){
        const id = el.dataset.id;
        const r = MY_REQUESTS.find(x=>x.id===id);
        showConfirm({
          title:'لغو درخواست بازار ثانویه',
          msg:`آیا از لغو درخواست ${r&&r.kind==='sell'?'فروش':'خرید'} ${toFa(r?r.qty:0)} خشت به قیمت ${fmt(r?r.price:0)} تومان مطمئن هستید؟`,
          confirmLabel:'لغو درخواست',
          onConfirm:()=>{
            const idx = MY_REQUESTS.findIndex(x=>x.id===id);
            if(idx>=0) MY_REQUESTS.splice(idx,1);
            state.confirm=null;
            showToast('درخواست شما لغو شد.');
            render();
            return;
          }
        });
        return;
      }
      else if(a==='submit-request'){
        const p = findProject(state.marketProject);
        const tab = state.marketTab;
        const qty = state.sellQty||0;
        const price = state.sellPrice||0;
        const range = marketPriceRange(p);
        if(qty<=0){ showToast('تعداد خشت را وارد کنید.','error'); return; }
        if(price<range.floor || price>range.ceil){ showToast(`قیمت باید بین ${fmt(range.floor)} و ${fmt(range.ceil)} تومان باشد.`,'error'); return; }
        const total = qty*price;
        const commission = Math.round(total*0.01);
        if(tab==='sell'){
          const mine = myBrickRow(p.id);
          const have = mine? mine.qty : 0;
          const alreadyOnSale = MY_REQUESTS.filter(r=>r.projectId===p.id && r.kind==='sell').reduce((s,r)=>s+r.qty,0);
          if(qty > have - alreadyOnSale){ showToast('خشت کافی برای ثبت این درخواست فروش ندارید.','error'); return; }
        } else {
          if(total+commission > state.walletBalance){ showToast('موجودی کیف پول شما کافی نیست.','error'); return; }
        }
        showConfirm({
          title:'تایید درخواست بازار ثانویه',
          msg:`آیا از ثبت درخواست ${tab==='sell'?'فروش':'خرید'} ${toFa(qty)} خشت از پروژه «${p.name}» به قیمت ${fmt(price)} تومان (کارمزد ۱٪) مطمئن هستید؟ درخواست شما حداکثر یک ماه در بازار نمایش داده می‌شود.`,
          confirmLabel:'ثبت درخواست',
          onConfirm:()=>{
            MY_REQUESTS.unshift({id:'mr'+Date.now(), kind:tab, projectId:p.id, qty, price, date:'۱۴۰۳/۰۶/۲۴', expiry:'۱۴۰۳/۰۷/۲۴'});
            state.confirm=null;
            showToast(`درخواست ${tab==='sell'?'فروش':'خرید'} شما در بازار ثانویه ثبت شد.`);
            render();
            return;
          }
        });
        return;
      }

      else if(a==='qty-inc'){ state.buyQty = Math.min(9999, (state.buyQty||0)+1); render(); }
      else if(a==='qty-dec'){ state.buyQty = Math.max(0, (state.buyQty||0)-1); render(); }
      else if(a==='qty-set'){ state.buyQty = Number(el.dataset.n); render(); }

      else if(a==='dep-chip'){ state.depositAmount = fmt(Number(el.dataset.n)); render(); }

      else if(a==='do-buy'){
        const p = findProject(state.buyProject);
        const qty = state.buyQty||0;
        if(qty<p.minBuy){ showToast(`حداقل ${toFa(p.minBuy)} خشت باید خریداری کنید.`,'error'); return; }
        const total = p.tokenPrice*qty;
        if(total>state.walletBalance){ showToast('موجودی کیف پول شما کافی نیست.','error'); return; }
        showConfirm({
          title:'تایید خرید خشت',
          msg:`آیا از خرید ${toFa(qty)} خشت از پروژه «${p.name}» به مبلغ ${fmt(total)} تومان مطمئن هستید؟`,
          confirmLabel:'تایید و خرید',
          onConfirm:()=>{
            state.walletBalance -= total;
            ORDERS.unshift({id:'so'+Date.now(), type:'buy', projectId:p.id, date:'۱۴۰۳/۰۶/۲۴', qty, total, status:'done', kind:'خرید مستقیم'});
            WALLET_TX.unshift({id:'w'+Date.now(), kind:'buy', title:`خرید ${qty} خشت — ${p.name}`, amount:-total, date:'۱۴۰۳/۰۶/۲۴', status:'done'});
            const existing = myBrickRow(p.id);
            if(existing){
              const totQty = existing.qty + qty;
              existing.avgBuyPrice = Math.round((existing.avgBuyPrice*existing.qty + p.tokenPrice*qty)/totQty);
              existing.qty = totQty;
              existing.lastStage = p.currentStage;
              existing.purchases.unshift({date:'۱۴۰۳/۰۶/۲۴', qty, price:p.tokenPrice, stage:p.currentStage});
            } else {
              MY_BRICKS.unshift({id:'b'+Date.now(), projectId:p.id, qty, avgBuyPrice:p.tokenPrice, lastStage:p.currentStage,
                purchases:[{date:'۱۴۰۳/۰۶/۲۴', qty, price:p.tokenPrice, stage:p.currentStage}]});
            }
            p.sold = Math.min(p.totalTokens, p.sold+qty);
            state.buyQty = p.minBuy;
            state.confirm = null;
            showToast(`${toFa(qty)} خشت از پروژه ${p.name} خریداری شد.`);
            render();
            return;
          }
        });
        return;
      }

      else if(a==='buy-offer'){ state.modal = {type:'buyOffer', id:el.dataset.id}; }

      else if(a==='notif-click'){ state.notifRead.add(el.dataset.id); }
      else if(a==='mark-all-read'){ NOTIFS.forEach(n=> state.notifRead.add(n.id)); showToast('همه اعلان‌ها خوانده‌شده شدند.'); }

      else if(a==='delete-card'){
        const id = el.dataset.id;
        showConfirm({
          title:'حذف کارت بانکی',
          msg:'آیا از حذف این کارت بانکی مطمئن هستید؟',
          onConfirm:()=>{
            state.cards = state.cards.filter(c=>c.id!==id);
            state.confirm=null;
            showToast('کارت بانکی حذف شد.');
            render();
            return;
          }
        });
        return;
      }

      else if(a==='copy-ref'){
        showToast('کد معرف کپی شد: '+ACCOUNT.referralCode,'info');
      }

      else if(a==='confirm-yes'){ if(state.confirm && state.confirm.onConfirm) state.confirm.onConfirm(); return; }
      else if(a==='confirm-cancel'){ closeConfirm(); return; }

      else if(a==='open-modal'){ state.modal = {type: el.dataset.modal, id: el.dataset.id||null}; }
      else if(a==='close-modal' || a==='close-modal-bg'){ state.modal = {type:null}; }

      else if(a==='modal-submit'){
        const modalEl = el.closest('.modal');
        const mt = el.dataset.modaltype;
        const getField = n => modalEl.querySelector(`[data-field="${n}"]`);
        const val = n => getField(n)?.value ?? '';

        if(mt==='deposit'){
          const n = Number(faNumToEn(state.depositAmount||'').replace(/[^0-9]/g,''))||0;
          if(n<10000){ showToast('حداقل مبلغ واریزی ۱۰,۰۰۰ تومان است.','error'); return; }
          if(n>100000000){ showToast('حداکثر مبلغ واریزی ۱۰۰,۰۰۰,۰۰۰ تومان است.','error'); return; }
          state.walletBalance += n;
          WALLET_TX.unshift({id:'w'+Date.now(), kind:'deposit', title:'افزایش موجودی — پرداخت آنلاین', amount:n, date:'۱۴۰۳/۰۶/۲۴', status:'done'});
          state.depositAmount='';
          showToast(`مبلغ ${fmt(n)} تومان به کیف پول شما اضافه شد.`);
        }
        else if(mt==='withdraw'){
          const n = Number(faNumToEn(val('withdraw-amount')).replace(/[^0-9]/g,''))||0;
          if(!n){ showToast('مبلغ برداشت را وارد کنید.','error'); return; }
          if(n>state.walletBalance){ showToast('مبلغ برداشت از موجودی شما بیشتر است.','error'); return; }
          if(!state.cards.length){ showToast('ابتدا یک حساب بانکی ثبت کنید.','error'); return; }
          state.walletBalance -= n;
          WALLET_TX.unshift({id:'w'+Date.now(), kind:'withdraw', title:'درخواست برداشت وجه', amount:-n, date:'۱۴۰۳/۰۶/۲۴', status:'pending'});
          showToast('درخواست برداشت ثبت شد و حداکثر ظرف ۳ روز کاری واریز می‌شود.');
        }
        else if(mt==='gift'){
          const code = val('gift-code').trim();
          if(code.length<8){ showToast('کد کارت هدیه معتبر نیست.','error'); return; }
          const amount = 5000000;
          state.walletBalance += amount;
          WALLET_TX.unshift({id:'w'+Date.now(), kind:'gift', title:'کارت هدیه', amount, date:'۱۴۰۳/۰۶/۲۴', status:'done'});
          showToast(`مبلغ ${fmt(amount)} تومان از کارت هدیه به کیف پول شما اضافه شد.`);
        }
        else if(mt==='receipt'){
          const amt = Number(faNumToEn(val('rc-amount')).replace(/[^0-9]/g,''))||0;
          const date = val('rc-date').trim();
          const trace = val('rc-trace').trim();
          if(!amt || !date || !trace){ showToast('لطفاً مبلغ، تاریخ و شماره پیگیری را وارد کنید.','error'); return; }
          WALLET_TX.unshift({id:'w'+Date.now(), kind:'deposit', title:`ثبت فیش واریزی — پیگیری ${trace}`, amount:amt, date, status:'pending'});
          showToast('فیش واریزی ثبت شد و پس از بررسی، موجودی شما افزایش می‌یابد.');
        }
        else if(mt==='addCard'){
          if(state.cards.length>=1){ showToast('تنها یک حساب بانکی می‌توانید ثبت کنید.','error'); return; }
          const bank = val('bank') || 'سایر';
          const holder = val('holder') || ACCOUNT.personal.name;
          const number = val('number') || '••••-••••-••••-••••';
          const iban = val('iban') || '—';
          state.cards.push({id:'c'+Date.now(), bank, holder, number, iban});
          showToast('کارت بانکی جدید افزوده شد.');
        }
        else if(mt==='editPersonal'){
          ACCOUNT.personal.name = val('name') || ACCOUNT.personal.name;
          ACCOUNT.personal.nationalId = val('nationalId') || ACCOUNT.personal.nationalId;
          ACCOUNT.personal.phone = val('phone') || ACCOUNT.personal.phone;
          ACCOUNT.personal.email = val('email') || ACCOUNT.personal.email;
          showToast('اطلاعات شخصی ذخیره شد.');
        }
        else if(mt==='buyOffer'){
          const o = OFFERS.find(x=>x.id===state.modal.id);
          if(!o) return;
          const commission = Math.round(o.price*o.qty*0.01);
          const total = o.price*o.qty + commission;
          if(total>state.walletBalance){ showToast('موجودی کیف پول شما کافی نیست.','error'); return; }
          state.walletBalance -= total;
          ORDERS.unshift({id:'so'+Date.now(), type:'buy', projectId:o.projectId, date:'۱۴۰۳/۰۶/۲۴', qty:o.qty, total, status:'done', kind:'خرید بازار ثانویه'});
          WALLET_TX.unshift({id:'w'+Date.now(), kind:'buy', title:`خرید ${o.qty} خشت — بازار ثانویه`, amount:-total, date:'۱۴۰۳/۰۶/۲۴', status:'done'});
          const p = findProject(o.projectId);
          const existing = myBrickRow(p.id);
          if(existing){
            const totQty = existing.qty + o.qty;
            existing.avgBuyPrice = Math.round((existing.avgBuyPrice*existing.qty + o.price*o.qty)/totQty);
            existing.qty = totQty;
            existing.purchases.unshift({date:'۱۴۰۳/۰۶/۲۴', qty:o.qty, price:o.price, stage:p.currentStage});
          } else {
            MY_BRICKS.unshift({id:'b'+Date.now(), projectId:p.id, qty:o.qty, avgBuyPrice:o.price, lastStage:p.currentStage,
              purchases:[{date:'۱۴۰۳/۰۶/۲۴', qty:o.qty, price:o.price, stage:p.currentStage}]});
          }
          OFFERS.splice(OFFERS.indexOf(o),1);
          state.modal={type:null};
          showToast(`${toFa(o.qty)} خشت از بازار ثانویه خریداری شد.`);
          render();
          return;
        }
        state.modal = {type:null};
      }

      render();
    });
  });
}

/* ============== LIVE SYNC ============== */
function syncMarketUI(){
  const p = findProject(state.marketProject) || PROJECTS[0];
  const c = mkCalc(p);
  const slider = document.querySelector('[data-field="sell-price"]');
  if(slider) slider.value = c.price;
  const val = document.getElementById('rl-val');
  if(val){ val.style.left = c.pct+'%'; val.textContent = `${millions(c.price)} میلیون تومان`; }
  const pin = document.querySelector('[data-field="mk-price"]');
  if(pin && document.activeElement!==pin) pin.value = c.price ? fmt(c.price) : '';
  const box = document.getElementById('mk-price-box');
  if(box) box.classList.toggle('err', !c.priceOk);
  const hint = document.getElementById('mk-price-hint');
  if(hint){ hint.classList.toggle('err', !c.priceOk); hint.innerHTML = mkPriceHint(c); }
  const tot = document.getElementById('mk-total');
  if(tot) tot.innerHTML = `${fmt(c.final)} <small>تومان</small>`;
  const fee = document.getElementById('mk-fee-txt');
  if(fee) fee.textContent = mkFeeText(c);
  const warn = document.getElementById('mk-warn');
  if(warn){ warn.hidden = !c.warn; const t = warn.querySelector('div'); if(t) t.textContent = c.warn; }
  const q = document.querySelector('[data-field="sell-qty"]');
  if(q && document.activeElement!==q) q.value = toFa(c.qty);
  const btn = document.querySelector('[data-action="submit-request"]');
  if(btn) btn.disabled = !(c.qty>0 && c.priceOk && !c.warn);
}
function syncBuyUI(){
  const p = findProject(state.buyProject);
  const qty = state.buyQty||0, total = p.tokenPrice*qty, after = state.walletBalance-total;
  const set=(id,h)=>{const e=document.getElementById(id); if(e) e.innerHTML=h;};
  set('bs-qty', `${toFa(qty)} خشت`);
  set('bs-total', `${fmt(total)} <small>تومان</small>`);
  set('bs-after', `${fmt(after)} تومان`);
  const af=document.getElementById('bs-after'); if(af) af.classList.toggle('neg', after<0);
  const w=document.getElementById('bs-warn');
  if(w){ w.hidden = !(after<0||qty<p.minBuy); set('bs-warn-t', qty<p.minBuy?`حداقل ${toFa(p.minBuy)} خشت باید خریداری کنید.`:'موجودی کیف پول کافی نیست.'); }
  const q = document.querySelector('[data-field="buy-qty"]');
  if(q && document.activeElement!==q) q.value = qty;
  const btn = document.querySelector('[data-action="do-buy"]');
  if(btn) btn.disabled = qty<p.minBuy;
  document.querySelectorAll('.chip[data-action="qty-set"]').forEach(c=>{
    c.classList.toggle('active', Number(c.dataset.n)===qty);
  });
}
function syncDepositUI(){
  const n = Number(faNumToEn(state.depositAmount||'').replace(/[^0-9]/g,''))||0;
  document.querySelectorAll('.chip[data-action="dep-chip"]').forEach(c=>{
    c.classList.toggle('active', Number(c.dataset.n)===n);
  });
  const tb = document.querySelector('.modal .total-box .tt-final .val');
  if(tb && n>0) tb.innerHTML = `${fmt(n)} <small style="font-size:12px;">تومان</small>`;
}

render();
</script>
